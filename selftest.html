  group('game: type shift');
  {
    const events = [];
    const g = new Game({ onEvent: (t, p) => events.push({ t, p }) });
    g.start('Neutral');
    g.plungeRelease();
    g._award(50000, { mult: false });
    const scoreBefore = g.run.score;
    g.run.discTier = 2;

    check('no charge to begin with', g.run.shiftCharges === 0);

    // Work the spinner.
    for (let i = 0; i < SPINS_PER_SHIFT; i++) {
      g.world.events.push({
        type: 'hit', id: 'spinner', collider: g.parts.spinner, ball: g.ball, normal: null, speed: 80
      });
      g._handleEvents();
    }
    check('the spinner charges a shift', g.run.shiftCharges === 1, String(g.run.shiftCharges));
    check('shiftCharged fired', events.some(e => e.t === 'shiftCharged'));

    g._enterSaucer(g.ball);
    g._lastNow = 900000;
    g._updateSaucer(900000);
    check('the Well offers a shift', events.some(e => e.t === 'shiftOffer'));
    check('the ball waits, held', g.ball.held === true && g.phase === PHASE.SAUCER);

    // Waiting must not drain or time out.
    for (let i = 0; i < 200; i++) { g._lastNow += 16; g.update(g._lastNow); }
    check('it waits indefinitely', g.phase === PHASE.SAUCER && g.ball.held === true);

    check('declining is possible', g.declineShift() === true);
    check('declining kicks the ball out', g.phase === PHASE.PLAY && g.ball.held === false);
    check('and keeps the charge', g.run.shiftCharges === 1);

    /**
     * Saying "stay" has to mean something.
     *
     * The charge is kept but the offer stops being made, because keeping the
     * charge and nothing else meant the Well asked again on the very next visit,
     * and the next, for the rest of the ball. Every shot up the middle turned into
     * the same dialog.
     */
    const offersBefore = events.filter(e => e.t === 'shiftOffer').length;
    for (let visit = 0; visit < 3; visit++) {
      g.ball.held = false;
      g.ball.moveTo(LAYOUT.saucer.x, LAYOUT.saucer.y);
      g._enterSaucer(g.ball);
      g._lastNow += 5000;
      g._updateSaucer(g._lastNow);
      g._lastNow += 5000;
      g._updateSaucer(g._lastNow);
    }
    check('the Well stops asking once you have said stay',
          events.filter(e => e.t === 'shiftOffer').length === offersBefore,
          `${events.filter(e => e.t === 'shiftOffer').length - offersBefore} more offers`);
    check('the charge is still banked', g.run.shiftCharges === 1);
    check('and the ball is not held hostage', g.ball.held === false);

    /* Earning another charge is a new question, so the offer comes back. */
    for (let i = 0; i < SPINS_PER_SHIFT; i++) {
      g.world.events.push({
        type: 'hit', id: 'spinner', collider: g.parts.spinner, ball: g.ball, normal: null, speed: 80
      });
      g._handleEvents();
    }
    check('a second charge is banked', g.run.shiftCharges === 2, String(g.run.shiftCharges));

    g.ball.held = false;
    g.ball.moveTo(LAYOUT.saucer.x, LAYOUT.saucer.y);
    g._enterSaucer(g.ball);
    g._lastNow += 5000;
    g._updateSaucer(g._lastNow);
    check('earning another charge asks again',
          events.filter(e => e.t === 'shiftOffer').length === offersBefore + 1);

    check('a bad type is refused', g.chooseShift('Nonsense') === false);
    check('shifting to the current type is refused', g.chooseShift('Neutral') === false);
    check('shifting works', g.chooseShift('Celestial') === true);

    check('the mode changed', g.run.type === 'Celestial' && g.mode.type === 'Celestial');
    check('the table was rebuilt', g.parts.gimmick.id === 'bloom', g.parts.gimmick.id);
    // Two were banked and one was spent, so one is left.
    check('the charge was spent', g.run.shiftCharges === 1, String(g.run.shiftCharges));
    check('accepting clears the refusal, so the last charge is offered again',
          g._shiftOnOffer() === true);
    check('the score carried over', g.run.score > scoreBefore, String(g.run.score));
    check('the disc carried over', g.run.discTier === 2);
    check('a new ball is served', g.phase === PHASE.PLUNGE && g.ball.held === true);
    check('typeShift fired', events.some(e => e.t === 'typeShift'));
  }

  group('game: nothing may kick the ball back into the Well');
  {
    /**
     * The regression test for a lock that made the game unplayable.
     *
     * Wildwood Green had its stump bumper at (42.5, 100), 24 units directly
     * above the Awakening Well. The Well ejects upwards, so the ball struck the
     * bumper from below, the contact normal pointed straight back down, and the
     * bumper's kick drove it into the hole it had just left. Which ejected it
     * into the bumper again. For as long as you cared to watch.
     */
    const S = LAYOUT.saucer;
    const box = {
      x0: S.x - S.exit.halfWidth,
      x1: S.x + S.exit.halfWidth,
      y0: S.exit.top,
      y1: S.y - S.r
    };
    const reach = new Ball({}).r;

    const nearBox = (px, py, pad) => {
      const cx = Math.max(box.x0, Math.min(box.x1, px));
      const cy = Math.max(box.y0, Math.min(box.y1, py));
      return Math.hypot(px - cx, py - cy) < pad;
    };

    /** Does this collider's surface reach into the Well's exit corridor? */
    const inCorridor = c => {
      if (c.sensor || !c.active) return false;
      if (c.kind === 'circle') return nearBox(c.c.x, c.c.y, c.r + reach);
      if (c.kind === 'seg') {
        for (let t = 0; t <= 1; t += 0.05) {
          const px = c.a.x + (c.b.x - c.a.x) * t;
          const py = c.a.y + (c.b.y - c.a.y) * t;
          if (nearBox(px, py, (c.thick || 0.6) + reach)) return true;
        }
        return false;
      }
      if (c.kind === 'arc') {
        for (let i = 0; i <= 60; i++) {
          const a = c.a0 + (c.sweep * i) / 60;
          const px = c.c.x + Math.cos(a) * c.r;
          const py = c.c.y + Math.sin(a) * c.r;
          if (nearBox(px, py, (c.thick || 0.6) + reach)) return true;
        }
        return false;
      }
      return false;
    };

    for (const t of MODE_KEYS) {
      const { world } = buildTable(t);
      const kickers = world.colliders.filter(c => (c.kick || 0) > 0 && inCorridor(c));
      check(`${t} has no kicker above the Well`, kickers.length === 0,
            kickers.map(c => `${c.id}@${c.kind === 'circle' ? `${c.c.x},${c.c.y}` : '?'}`).join(' '));

      // Walls are allowed — they deflect sideways — but it is worth knowing.
      const blockers = world.colliders.filter(c => !(c.kick > 0) && inCorridor(c));
      if (blockers.length) note(`${t}: ${blockers.length} non-kicking collider(s) in the corridor: ${blockers.map(c => c.id).join(', ')}`);
    }
  }

  group('game: the Well ejects at an angle and escalates');
  {
    const g = new Game({});
    g.start('Neutral');
    g.plungeRelease();
    g._lastNow = 100000;

    const eject = () => {
      g.ball.held = false;
      g._kickOutOfSaucer();
      return { x: g.ball.vel.x, y: g.ball.vel.y };
    };

    const a = eject();
    const b = eject();
    check('the ejection is never straight up', Math.abs(a.x) > 5, a.x.toFixed(1));
    check('it alternates sides', Math.sign(a.x) !== Math.sign(b.x),
          `${a.x.toFixed(1)} then ${b.x.toFixed(1)}`);
    check('it still mostly goes up', a.y < -150 && b.y < -150, `${a.y.toFixed(1)}`);
    check('the speed is unchanged by the angle',
          Math.abs(Math.hypot(a.x, a.y) - SAUCER_KICK) < 1, Math.hypot(a.x, a.y).toFixed(1));

    // A quick re-entry widens the next one.
    const shallow = Math.abs(a.x);
    g.ball.held = false;
    g._enterSaucer(g.ball);
    check('a quick return counts as a lock', g._saucerLocks === 1, String(g._saucerLocks));
    const c = eject();
    check('the angle widens after a lock', Math.abs(c.x) > shallow * 1.5,
          `${shallow.toFixed(1)} -> ${Math.abs(c.x).toFixed(1)}`);

    // The phase has to be reset between entries: _enterSaucer refuses when the
    // ball is already in the Well, so without this the escalation only ever
    // reaches one and the test would pass for the wrong reason.
    for (let i = 0; i < 6; i++) {
      g.phase = PHASE.PLAY;
      g.ball.held = false;
      g._enterSaucer(g.ball);
    }
    check('escalation is capped', g._saucerLocks === SAUCER_MAX_ESCALATION, String(g._saucerLocks));
    const wide = eject();
    check('at full escalation it is fired sideways', Math.abs(wide.x) > 100, Math.abs(wide.x).toFixed(1));

    // A slow return is an ordinary shot, not a lock.
    g._lastNow += SAUCER_RELOCK_MS * 2;
    g.phase = PHASE.PLAY;
    g.ball.held = false;
    g._enterSaucer(g.ball);
    check('a slow return resets the escalation', g._saucerLocks === 0, String(g._saucerLocks));
  }

  group('game: the ball escapes the Well in every mode');
  {
    /**
     * The dynamic version, which is what actually caught the bug: drop the ball
     * in the Well and then just let the game run. A locked table re-enters
     * roughly every 0.85 s, so twenty-five seconds of it is around thirty
     * entries. Anything healthy is in single figures.
     */
    for (const t of MODE_KEYS) {
      let entries = 0;
      const g = new Game({ onEvent: (type) => { if (type === 'saucer') entries++; } });
      g.start(t);
      g.plungeRelease();
      g.run.ballSaveFor = 0;                  // let it drain if it wants to

      let now = 1000;
      g.update(now);
      g.ball.held = false;
      g.ball.moveTo(LAYOUT.saucer.x, LAYOUT.saucer.y);
      g.ball.freeze();

      for (let i = 0; i < 25 * 60; i++) {     // 25 s at 60 fps
        now += 1000 / 60;
        g.update(now);
        if (g._awaitingShift) g.declineShift();
      }

      check(`${t} does not lock in the Well`, entries < 8, `${entries} entries in 25 s`);
    }
  }

  group('game: ball search breaks a lock the layout did not');
  {
    const events = [];
    const g = new Game({ onEvent: (t, p) => events.push({ t, p }) });
    g.start('Neutral');
    g.plungeRelease();
    g.run.ballSaveFor = 0;

    let now = 1000;
    g.update(now);

    // Pin the ball inside a tiny area, whatever the physics wants to do — the
    // shape any real lock takes.
    for (let i = 0; i < 26 * 60; i++) {
      now += 1000 / 60;
      g.ball.moveTo(40 + (i % 3), 90 + (i % 4));
      g.ball.setVel(60, -60);
      g.update(now);
    }

    const searches = events.filter(e => e.t === 'ballSearch');
    check('a confined ball triggers a search', searches.length >= 1, `${searches.length} searches`);
    check('the first search waited, rather than firing at once',
          searches.length === 0 || searches[0].p.attempt === 1);

    /**
     * And it has to survive the ball being held.
     *
     * The lock this guard was written for spent most of its cycle held in the
     * Well. Clearing the box on `held`, or treating the SAUCER phase as not
     * live, restarted the count every cycle — so the guard would have watched
     * the exact failure it exists for and never fired.
     */
    const gh = new Game({});
    gh.start('Neutral');
    gh.plungeRelease();
    gh.update(1000);
    gh.ball.moveTo(40, 100);
    gh.update(1016);
    check('a box is being tracked', !!gh._penBox);

    gh.ball.held = true;
    gh.phase = PHASE.SAUCER;
    gh.update(1032);
    check('the Well does not reset the confinement box', !!gh._penBox);

    gh.phase = PHASE.PLUNGE;
    gh.update(1048);
    check('but the plunger does', gh._penBox === null);

    // And the shove is real.
    const g2 = new Game({});
    g2.start('Neutral');
    g2.plungeRelease();
    g2.update(1000);
    g2._penBox = { x0: 40, x1: 41, y0: 90, y1: 91 };
    g2._penSince = 0;
    g2.ball.moveTo(40, 90);
    g2.ball.setVel(0, 0);
    g2._ballSearch(SEARCH_AFTER_MS + 100);
    check('the search actually shoves the ball', g2.ball.speed > 40, g2.ball.speed.toFixed(1));
    check('and it shoves away from the near wall', g2.ball.vel.x > 0, g2.ball.vel.x.toFixed(1));

    // Ordinary play must never trip it.
    let g3Searches = 0;
    const g3 = new Game({ onEvent: (t) => { if (t === 'ballSearch') g3Searches++; } });
    g3.start('Mechanic');
    g3.plungeRelease();
    let n3 = 1000;
    for (let i = 0; i < 30 * 60; i++) {
      n3 += 1000 / 60;
      if (i % 26 === 0) { g3.flip('left', true); g3.flip('right', true); }
      if (i % 26 === 9) { g3.flip('left', false); g3.flip('right', false); }
      g3.update(n3);
      if (g3._awaitingShift) g3.declineShift();
    }
    check('normal play does not trigger a search', g3Searches === 0, String(g3Searches));
  }

  group('game: pausing is safe for as long as you like');
  {
    const g = new Game({});
    g.start('Neutral');
    g.plungeRelease();
    g.update(50000);

    g.parts.flippers.left.up = true;
    g.parts.flippers.right.up = true;
    g._saucerUntil = 50000 + 700;
    g._ballLostUntil = 50000 + 1600;
    g._penSince = 50000;

    const before = { saucer: g._saucerUntil, lost: g._ballLostUntil, pen: g._penSince };

    g.pause();
    check('pausing sets paused', g.paused === true);
    check('pausing drops both flippers',
          g.parts.flippers.left.up === false && g.parts.flippers.right.up === false);

    // A real wait, so the shift is measured rather than assumed.
    await new Promise(r => setTimeout(r, 120));
    g.resume();

    check('resuming clears paused', g.paused === false);
    const shift = g._saucerUntil - before.saucer;
    check('the Well timer was carried forward', shift > 60, `${shift.toFixed(0)} ms`);
    check('so was the between-balls timer',
          Math.abs((g._ballLostUntil - before.lost) - shift) < 5);
    check('so was the ball-search window',
          Math.abs((g._penSince - before.pen) - shift) < 5);
    check('the physics clock is reset so nothing fast-forwards', g._lastNow === 0);

    // Updating while paused must do nothing at all.
    g.pause();
    const y = g.ball.pos.y;
    for (let i = 0; i < 60; i++) g.update(60000 + i * 16);
    check('a paused game does not move the ball', g.ball.pos.y === y);
    g.resume();

    check('double pause and resume are harmless', (() => {
      try { g.pause(); g.pause(); g.resume(); g.resume(); return true; }
      catch { return false; }
    })());
  }

  group('game: a full frame loop runs without throwing');
  {
    /**
     * The closest thing to actually playing: launch and run twenty simulated
     * seconds of frames with the flippers working, in every mode. Anything
     * that throws inside update() kills the render loop and the game with it,
     * so this is the check that matters most.
     */
    for (const t of MODE_KEYS) {
      const g = new Game({});
      g.start(t);

      let threw = null;
      let now = 1000;
      try {
        g.plungeStart();
        for (let i = 0; i < 20; i++) { now += 16; g.update(now); }
        g.plungeRelease();

        for (let i = 0; i < 1200; i++) {         // ~20 s at 60 fps
          now += 16;
          // Work the flippers on a rhythm, and arm things periodically so the
          // sub-modes get exercised too.
          if (i % 24 === 0) { g.flip('left', true); g.flip('right', true); }
          if (i % 24 === 8) { g.flip('left', false); g.flip('right', false); }
          if (i % 200 === 0) g.run && (g.run.encounterArmed = true);
          g.update(now);
          if (g._awaitingShift) g.declineShift();
        }
      } catch (e) { threw = e.stack || e.message; }

      check(`${t} survives 20 s of play`, threw === null, threw ? threw.split('\n')[0] : '');
      check(`  ${t} ended in a sane phase`,
            Object.values(PHASE).includes(g.phase), g.phase);
      check(`  ${t} kept the score finite`,
            Number.isFinite(g.run?.score ?? 0), String(g.run?.score));
      check(`  ${t} leaked no creature colliders`,
            g.phase === PHASE.GAME_OVER || !g.sub
              ? !g.world.colliders.some(c => c.meta?.role === 'creature') || !!g.sub
              : true);
    }
  }

  /* =====================================================
     Renderer
     ===================================================== */
  group('render: transform and drawing');
  {
    // A real, laid-out canvas: getBoundingClientRect returns zeros for a
    // detached element, and the whole transform is derived from it.
    const canvas = document.createElement('canvas');
    canvas.style.cssText = 'position:fixed;left:0;top:0;width:360px;height:760px';
    document.body.append(canvas);

    const r = new Renderer(canvas).resize();

    check('scale fits the table by its tighter axis',
          Math.abs(r.scale - Math.min(360 / 100, 760 / 180)) < 1e-9, r.scale.toFixed(4));
    check('the table is centred', r.originX >= 0 && r.originY >= 0,
          `${r.originX.toFixed(1)},${r.originY.toFixed(1)}`);
    check('the backing store respects a capped DPR', r.dpr <= 2 && r.dpr > 0, String(r.dpr));
    check('the canvas has a backing store', canvas.width > 0 && canvas.height > 0,
          `${canvas.width}x${canvas.height}`);

    // toScreen and toTable must be exact inverses, because input handling
    // converts touches back into table space for nudges.
    const back = r.toScreen(37.5, 122.25);
    const there = r.toTable(back.x, back.y);
    check('toScreen and toTable round trip',
          Math.abs(there.x - 37.5) < 1e-6 && Math.abs(there.y - 122.25) < 1e-6,
          `${there.x.toFixed(4)},${there.y.toFixed(4)}`);
    check('the table origin maps to the letterbox corner',
          Math.abs(r.toScreen(0, 0).x - r.originX) < 1e-9);

    // Colour helper: canvas fails silently on a bad colour, so this matters.
    check('_alpha expands 3-digit hex', r._alpha('#fff', 0.5) === 'rgba(255,255,255,0.5)', r._alpha('#fff', 0.5));
    check('_alpha handles 6-digit hex', r._alpha('#b07cff', 1) === 'rgba(176,124,255,1)', r._alpha('#b07cff', 1));
    check('_alpha survives rubbish', r._alpha('nonsense', 0.4).startsWith('rgba('), r._alpha('nonsense', 0.4));

    /* Draw every mode, in the states the game actually puts it in. A throw
       here kills the render loop and the game with it, so it is worth
       exercising all of them rather than trusting one. */
    for (const t of MODE_KEYS) {
      const table = buildTable(t);
      table.world.addBall(newBall());
      r.setTable(table);

      const views = [
        { label: 'plain', view: {} },
        { label: 'plunging', view: { plunger: 0.6, discTier: 1 } },
        { label: 'shaking', view: { shake: 0.8, discTier: 3 } },
        {
          label: 'encounter',
          view: {
            discTier: 2,
            litLetters: { lanes: [true, false, true], bank: [true, true, false, false, false] },
            encounter: {
              sprite: bossOf(t)?.imagePath, shiny: true,
              x: LAYOUT.centre, y: 92, r: 11, meterFrac: 0.45, flash: 0.7
            }
          }
        },
        { label: 'no effects', view: { discTier: 0, showTrail: false } }
      ];

      let threw = null;
      for (const { label, view } of views) {
        try {
          if (label === 'no effects') r.effects = false;
          r.draw(view);
          r.effects = true;
        } catch (e) { threw = `${label}: ${e.message}`; break; }
      }
      check(`${t} draws in every state`, threw === null, threw || '');
    }

    // Resizing mid-game must not leave a stale transform behind.
    canvas.style.width = '420px';
    canvas.style.height = '600px';
    r.resize();
    check('resize recomputes the scale',
          Math.abs(r.scale - Math.min(420 / 100, 600 / 180)) < 1e-9, r.scale.toFixed(4));
    let resizeThrew = null;
    try { r.draw({ discTier: 1 }); } catch (e) { resizeThrew = e.message; }
    check('drawing after a resize is fine', resizeThrew === null, resizeThrew || '');

    canvas.remove();
  }

  group('render: sprite cache');
  {
    const a = getSprite('images/Meditot.png');
    const b = getSprite('images/Meditot.png');
    check('the same path returns the same element', a === b);
    check('a null path returns null', getSprite(null) === null);
    check('spriteReady is false before load', typeof spriteReady(a) === 'boolean');

    // Give it a moment, then confirm a real sprite does become ready â€” this is
    // what the encounter draw depends on.
    await new Promise(res => {
      if (spriteReady(a)) return res();
      a.addEventListener('load', res, { once: true });
      a.addEventListener('error', res, { once: true });
      setTimeout(res, 3000);
    });
    check('a real sprite becomes ready', spriteReady(a) === true,
          `complete=${a.complete} w=${a.naturalWidth}`);
  }

  group('tuning table sanity');
  {
    check('capture meter defined for every rarity', [1, 2, 3, 4, 5].every(r => CAPTURE_METER[r] > 0));
    check('disc tiers ascend in power', DISC_TIERS.every((d, i) => i === 0 || d.power > DISC_TIERS[i - 1].power));
    check('a Master Disc beats an Epic in 2 hits',
          Math.ceil(CAPTURE_METER[4] / DISC_TIERS[3].power) === 2);
    check('a plain Disc needs 6 hits for an Epic',
          Math.ceil(CAPTURE_METER[4] / DISC_TIERS[0].power) === 6);
  }
}

/**
 * Hand the run back to tools/testserver.py, which is waiting for exactly one
 * of these before it shuts down. Opened in an ordinary browser there is no
 * such endpoint, so the failure is swallowed and the page just shows its
 * results on screen.
 */
async function post(summary, threw) {
  const body = JSON.stringify({ summary, pass, fail, threw: threw || null, report }, null, 1);
  try { await fetch('/__result', { method: 'POST', body, headers: { 'Content-Type': 'application/json' } }); }
  catch { /* no test server; the DOM output is the result */ }
}

run().then(() => {
  const summary = fail === 0 ? `ALL ${pass} CHECKS PASSED` : `${fail} FAILED, ${pass} passed`;
  const s = document.getElementById('summary');
  s.textContent = summary;
  s.className = fail === 0 ? 'pass' : 'fail';
  return post(summary, null);
}).catch(err => {
  const threw = err && err.stack ? err.stack : String(err);
  const summary = `THREW after ${pass} passing checks`;
  const s = document.getElementById('summary');
  s.textContent = `${summary}: ${threw}`;
  s.className = 'fail';
  fail++;
  return post(summary, threw);
});
</script>
</body>
</html>
