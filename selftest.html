<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pinball Creatures â€” self test</title>
<style>
  body { font: 13px/1.55 ui-monospace, Consolas, monospace; background: #0b1024; color: #dfe4f5; padding: 16px; }
  .pass { color: #4ade80; }
  .fail { color: #ff6b6b; font-weight: 700; }
  .note { color: #8b93ad; }
  h2 { color: #b07cff; margin: 18px 0 6px; font-size: 14px; }
  #summary { font-size: 15px; font-weight: 700; margin-bottom: 12px; padding: 8px; border: 1px solid #2b3350; }
</style>
</head>
<body>
<!--
  Headless test harness. Lives at the project root, not in tools/, because
  data.js fetches the CSVs with document-relative paths â€” the same paths
  index.html will use. From tools/ they resolve to /tools/*.csv and 404.

  Run it with tools\run-selftest.ps1, or by hand:
      python -m http.server 8123 --bind 127.0.0.1
      chrome --headless --disable-gpu --virtual-time-budget=30000 \
             --dump-dom http://127.0.0.1:8123/selftest.html

  Output is ASCII only: it comes back through a PowerShell pipe, and box
  characters or em dashes arrive as mojibake and make failures hard to read.

  Everything is written into the DOM rather than the console so --dump-dom
  captures it. #summary starts as RUNNING and is only ever replaced, so a
  module that throws on import leaves RUNNING behind and the run is visibly
  a failure rather than silently empty.
-->
<div id="summary">RUNNING</div>
<div id="out"></div>

<script type="module">
import {
  loadDatabase, DB, TYPES, MODES, RARITY_WEIGHTS, BOSS_OVERRIDES,
  bossOf, rollEncounter, speciesByName, lineagePath,
  familyMembers, effectiveRarityOf, parseCSV, CAPTURE_METER, DISC_TIERS,
  MAX_DISC_TIER, MAX_MULTIPLIER, GATE_CATCHES_NEEDED, EVOLUTION_SHARDS,
  EXTRA_BALL_AT, SCORE, BALLS_PER_GAME,
  CAPTURE_BALL_SAVE_SECONDS, SHINY_ODDS, SHINY_DOUBLE_AT,
  SETS, SET_KEYS, BASE_SET, GALACTIC_UNLOCKS, bossOddsFor,
  speciesOfSet, speciesOfType, bossOfSet, galacticBossOf, bossChoicesFor,
  galacticRaritiesUnlocked, nextGalacticUnlock, evolutionTargets,
  MODE_KEYS, modeSet, modeType, allBossesForMode, statTotal, RARITY_SHAPE,
  VAULT_UNLOCK_REGISTERED, VAULT_UNLOCK_SETS, VAULT_MODE, vaultUnlocked
} from './js/data.js';

import {
  World, Ball, Flipper, Rotor, segment, circle, arc, field, sensorCircle,
  PHYS_DT, MAX_SPEED, TABLE_W, vdist, vec
} from './js/physics.js';

import { buildTable, newBall, launchImpulse, LAYOUT } from './js/table.js';

import { Renderer, getSprite, spriteReady } from './js/render.js';

import {
  Game, PHASE, BALL_LOST_PAUSE, SPINS_PER_SHIFT,
  SAUCER_KICK, SAUCER_RELOCK_MS, SAUCER_MAX_ESCALATION, SEARCH_AFTER_MS
} from './js/game.js';

import { blankSave, store } from './js/state.js';

const out = document.getElementById('out');
let pass = 0, fail = 0;

/* Every line is recorded as well as rendered, so the run can be posted back
   to the test server. The DOM copy is for reading it in a real browser. */
const report = [];
let currentGroup = '';

function group(name) {
  currentGroup = name;
  report.push({ kind: 'group', text: name });
  out.append(Object.assign(document.createElement('h2'), { textContent: name }));
}

function check(label, ok, detail = '') {
  report.push({ kind: ok ? 'pass' : 'fail', group: currentGroup, label, detail: String(detail) });
  const d = document.createElement('div');
  d.className = ok ? 'pass' : 'fail';
  d.textContent = `${ok ? 'PASS' : 'FAIL'}  ${label}${detail ? '  == ' + detail : ''}`;
  out.append(d);
  ok ? pass++ : fail++;
  return ok;
}

function note(text) {
  report.push({ kind: 'note', text: String(text) });
  const d = document.createElement('div');
  d.className = 'note';
  d.textContent = '      ' + text;
  out.append(d);
}

const near = (a, b, tol) => Math.abs(a - b) <= tol;

async function run() {
  /* =====================================================
     CSV parser
     ===================================================== */
  group('parseCSV');
  {
    const rows = parseCSV('a,b,c\r\n1,"two, still two",3\r\n4,"say ""hi""",6\r\n\r\n');
    check('row count ignores blank lines', rows.length === 3, `got ${rows.length}`);
    check('quoted comma kept in one field', rows[1][1] === 'two, still two', rows[1][1]);
    check('doubled quote unescaped', rows[2][1] === 'say "hi"', rows[2][1]);

    const bom = parseCSV('\uFEFFid,name\n1,x\n');
    check('BOM stripped from first header', bom[0][0] === 'id', JSON.stringify(bom[0][0]));
  }

  /* =====================================================
     Database
     ===================================================== */
  group('loadDatabase');
  await loadDatabase();

  check('205 species loaded across all sets', DB.species.length === 205, `got ${DB.species.length}`);
  check('79 from Elemental Awakening', speciesOfSet('ea').length === 79, `got ${speciesOfSet('ea').length}`);
  check('77 from Galactic Adventures', speciesOfSet('ga').length === 77, `got ${speciesOfSet('ga').length}`);
  check('49 Exclusives', speciesOfSet('ex').length === 49, `got ${speciesOfSet('ex').length}`);
  check('six playable tables', MODE_KEYS.length === 6, MODE_KEYS.join(','));
  check('five of them are types', MODE_KEYS.filter(k => modeType(k)).length === 5);
  check('one of them is a set', MODE_KEYS.filter(k => modeSet(k)).length === 1,
        MODE_KEYS.filter(k => modeSet(k)).join(','));
  check('every type key has a mode', TYPES.every(t => MODES[t] && MODES[t].type === t));
  check('no rarity 5 in RARITY_WEIGHTS', !(5 in RARITY_WEIGHTS));

  /* Sets must not interleave, or the Collection reads as one shuffled dex. */
  {
    const first = DB.species.findIndex(s => s.setKey === 'ga');
    const last = DB.species.map(s => s.setKey).lastIndexOf('ea');
    check('the sets do not interleave', first > last, `first ga=${first}, last ea=${last}`);
    check('ids are unique across sets', new Set(DB.species.map(s => s.id)).size === DB.species.length);
    check('names are unique across sets',
          new Set(DB.species.map(s => s.name.toLowerCase())).size === DB.species.length);
    check('every species carries its set', DB.species.every(s => SET_KEYS.includes(s.setKey)));
  }

  if (DB.warnings.length) {
    note(`data warnings (${DB.warnings.length}):`);
    DB.warnings.slice(0, 12).forEach(w => note('  ! ' + w));
  } else {
    note('no data warnings');
  }

  group('species per type');
  {
    for (const [t, n] of Object.entries({ Mystic: 17, Neutral: 16, Mechanic: 16, Wind: 15, Celestial: 15 })) {
      const got = speciesOfType(t, 'ea').length;
      check(`${t} has ${n} Awakening species`, got === n, `got ${got}`);
    }
    for (const [t, n] of Object.entries({ Neutral: 19, Celestial: 17, Mystic: 14, Mechanic: 14, Wind: 13 })) {
      const got = speciesOfType(t, 'ga').length;
      check(`${t} has ${n} Galactic species`, got === n, `got ${got}`);
    }
    check('every type has creatures in both sets',
          TYPES.every(t => speciesOfType(t, 'ea').length && speciesOfType(t, 'ga').length));
  }

  group('catchable split');
  {
    const bosses = DB.species.filter(s => s.isBoss);
    check('15 bosses, one per type per set', bosses.length === 15,
          `got ${bosses.length}: ${bosses.map(b => b.name).join(', ')}`);

    for (const [key, stage1, evoOnly] of [['ea', 42, 37], ['ga', 40, 37], ['ex', 30, 19]]) {
      const mine = speciesOfSet(key);
      const s1 = mine.filter(s => s.stage === 1);
      const catchable = mine.filter(s => s.isCatchable);
      const setBosses = mine.filter(s => s.isBoss);
      check(`${key}: ${stage1} first stages`, s1.length === stage1, `got ${s1.length}`);
      check(`${key}: ${evoOnly} are evolution-only`,
            mine.filter(s => s.stage > 1).length === evoOnly,
            `got ${mine.filter(s => s.stage > 1).length}`);
      check(`${key}: 5 bosses`, setBosses.length === 5, `got ${setBosses.length}`);
      check(`${key}: catchable + bosses = every first stage`,
            catchable.length + setBosses.length === stage1,
            `${catchable.length} + ${setBosses.length}`);
      check(`${key}: every first stage carries a rarity`,
            s1.every(s => s.rarity >= 1 && s.rarity <= 5));
    }
  }

  group('bosses');
  {
    const expected = {
      ea: {
        Mystic: 'Pheonyx', Wind: 'Pyrosora', Mechanic: 'Envoye',
        Neutral: BOSS_OVERRIDES.ea.Neutral, Celestial: BOSS_OVERRIDES.ea.Celestial
      },
      ga: {
        Mystic: 'Pantheraura', Wind: 'Electrogriff', Celestial: 'Starraffe',
        Mechanic: 'Metalmagma', Neutral: BOSS_OVERRIDES.ga.Neutral
      },
      /* The Raid Vault's five come from one file, one per type, so it needs no
         override at all. */
      ex: {
        Mystic: 'Necrosmion', Wind: 'Origamiros', Neutral: 'Aprorok',
        Celestial: 'Yerba', Mechanic: 'Terravoltz'
      }
    };

    for (const key of SET_KEYS) {
      for (const [t, name] of Object.entries(expected[key])) {
        const b = bossOfSet(key, t);
        check(`${key} ${t} boss is ${name}`, !!b && b.name === name, b ? b.name : 'none');
        if (b) {
          check(`  ${name} reports rarity 5`, b.effectiveRarity === 5, String(b.effectiveRarity));
          check(`  ${name} is in the ${key} set`, b.setKey === key, b.setKey);
        }
      }
    }

    check('bossOf returns the base set', bossOf('Mystic')?.name === 'Pheonyx', bossOf('Mystic')?.name);
    check('galacticBossOf returns the other', galacticBossOf('Mystic')?.name === 'Pantheraura',
          galacticBossOf('Mystic')?.name);
    check('Alpakina flagged as promoted', bossOf('Neutral')?.promotedBoss === true);
    check('Goggly flagged as promoted', galacticBossOf('Neutral')?.promotedBoss === true);
    check('Pheonyx not flagged as promoted', bossOf('Mystic')?.promotedBoss === false);
    check('Pantheraura not flagged as promoted', galacticBossOf('Mystic')?.promotedBoss === false);

    // The two bosses of a type must be different creatures, or the gate has one.
    for (const t of TYPES) {
      check(`${t}'s two legendaries are different`,
            bossOf(t)?.id !== galacticBossOf(t)?.id,
            `${bossOf(t)?.name} / ${galacticBossOf(t)?.name}`);
    }
  }

  group('encounter pools');
  {
    for (const t of MODE_KEYS) {
      const pool = DB.pools.get(t);
      const flat = Object.values(pool).flat();
      const bossIds = SET_KEYS.map(k => bossOfSet(k, t)?.id).filter(Boolean);
      check(`${t} pool excludes both its bosses`, !flat.some(s => bossIds.includes(s.id)),
            flat.filter(s => bossIds.includes(s.id)).map(s => s.name).join(','));
      check(`${t} pool is all stage 1`, flat.every(s => s.stage === 1));
      note(`${t}: ` + [1, 2, 3, 4].map(r => {
        const ea = pool[r].filter(s => s.setKey === 'ea').length;
        const ga = pool[r].filter(s => s.setKey === 'ga').length;
        return `r${r}=${ea}+${ga}`;
      }).join(' ') + `  bosses=${bossIds.length}`);
    }

    const neutral = DB.pools.get('Neutral');
    check('Neutral r4 keeps Dewmo only',
          neutral[4].length === 1 && neutral[4][0].name === 'Dewmo',
          neutral[4].map(s => s.name).join(','));
    check('Celestial r4 has only its Galactic Epic',
          DB.pools.get('Celestial')[4].every(s => s.setKey === 'ga'),
          DB.pools.get('Celestial')[4].map(s => `${s.name}:${s.setKey}`).join(','));

    /* Galactic Neutral has no Epic at all, which is a fact about the source data
       and worth stating rather than discovering as an empty tier later. */
    check('Galactic Neutral has no Epic',
          neutral[4].filter(s => s.setKey === 'ga').length === 0);
  }

  group('rollEncounter');
  {
    /* With nothing unlocked, only the base set may ever appear on a type table. */
    for (const t of TYPES) {
      let bad = 0;
      const seen = new Set();
      for (let i = 0; i < 3000; i++) {
        const sp = rollEncounter(t);
        if (!sp) { bad++; continue; }
        seen.add(sp.id);
        if (sp.type !== t || sp.stage !== 1 || sp.effectiveRarity === 5 || sp.setKey !== 'ea') {
          bad = -1; break;
        }
      }
      check(`${t} rolls only unlocked catchables`, bad === 0, `bad=${bad}`);
      const poolSize = Object.values(DB.pools.get(t)).flat().filter(s => s.setKey === 'ea').length;
      check(`${t} reaches every Awakening creature in its pool`, seen.size === poolSize,
            `${seen.size}/${poolSize}`);
    }

    const minR = [];
    for (let i = 0; i < 500; i++) { const s = rollEncounter('Mechanic', { minRarity: 3 }); if (s) minR.push(s.effectiveRarity); }
    check('minRarity floor respected', minR.length > 0 && minR.every(r => r >= 3));
  }

  /**
   * The unlock ladder.
   *
   * Gated on registered Elemental Awakening creatures. The important properties
   * are that a locked tier can never be rolled, that unlocking one tier does not
   * leak the others, and that unlocking changes variety rather than rarity.
   */
  group('galactic unlocks');
  {
    check('nothing is unlocked at zero', galacticRaritiesUnlocked(0).length === 0);
    check('nothing at 49', galacticRaritiesUnlocked(49).length === 0);
    check('Common at 50', galacticRaritiesUnlocked(50).join() === '1');
    check('still only Common at 59', galacticRaritiesUnlocked(59).join() === '1');
    check('Uncommon at 60', galacticRaritiesUnlocked(60).join() === '1,2');
    check('Rare at 65', galacticRaritiesUnlocked(65).join() === '1,2,3');
    check('Epic at 70', galacticRaritiesUnlocked(70).join() === '1,2,3,4');
    check('and no more past the top', galacticRaritiesUnlocked(200).join() === '1,2,3,4');

    check('next unlock at 0 is Common at 50', nextGalacticUnlock(0)?.registered === 50);
    check('next unlock at 55 is Uncommon at 60', nextGalacticUnlock(55)?.rarity === 2);
    check('nothing left to unlock at 70', nextGalacticUnlock(70) === null);

    /* A locked tier must be unreachable, and an open one reachable. */
    for (const tier of [1, 2, 3, 4]) {
      const open = [tier];
      const seen = new Set();
      for (const t of TYPES) {
        for (let i = 0; i < 4000; i++) {
          const sp = rollEncounter(t, { galacticRarities: open });
          if (sp?.setKey === 'ga') seen.add(sp.effectiveRarity);
        }
      }
      const leaked = [...seen].filter(r => r !== tier);
      check(`unlocking rarity ${tier} leaks no other tier`, leaked.length === 0, leaked.join(','));
    }

    /* Every Galactic creature becomes reachable with everything open. */
    {
      const all = [1, 2, 3, 4];
      const seen = new Set();
      for (const t of MODE_KEYS) {
        for (let i = 0; i < 20000; i++) {
          const sp = rollEncounter(t, { galacticRarities: all });
          if (sp) seen.add(sp.id);
        }
      }
      const want = DB.species.filter(s => s.isCatchable && s.rarity && s.stage === 1);
      const missed = want.filter(s => !seen.has(s.id));
      check('with everything open, every catchable is reachable', missed.length === 0,
            missed.map(s => `${s.name}:${s.setKey}`).slice(0, 8).join(','));
      note(`${seen.size} distinct catchables rolled of ${want.length}`);
    }

    /* Unlocking must not change how often each rarity appears — only which
       creatures fill it. That is the whole design claim of the ladder. */
    {
      const share = open => {
        const counts = { 1: 0, 2: 0, 3: 0, 4: 0 };
        let n = 0;
        for (let i = 0; i < 40000; i++) {
          const sp = rollEncounter('Mystic', { galacticRarities: open });
          if (!sp) continue;
          counts[sp.effectiveRarity]++; n++;
        }
        return [1, 2, 3, 4].map(r => counts[r] / n);
      };
      const before = share([]);
      const after = share([1, 2, 3, 4]);
      const drift = Math.max(...before.map((v, i) => Math.abs(v - after[i])));
      check('unlocking does not shift the rarity mix', drift < 0.04, drift.toFixed(3));
      note('Mystic rarity share locked  ' + before.map(v => v.toFixed(3)).join(' '));
      note('Mystic rarity share open    ' + after.map(v => v.toFixed(3)).join(' '));
    }

    /* Evolved Galactic forms follow their family's rarity, so evolving something
       you were allowed to catch is never blocked. */
    {
      const psybella = speciesByName('Psybella');          // ga, rarity 3
      const fuschioria = speciesByName('Fuschioria');       // its stage 2
      check('a Galactic evolution inherits the family rarity',
            fuschioria.effectiveRarity === psybella.effectiveRarity,
            `${fuschioria.effectiveRarity} vs ${psybella.effectiveRarity}`);
      check('and evolutionTargets does not gate it',
            evolutionTargets(psybella.id).some(s => s.id === fuschioria.id));
    }
  }

  /**
   * The Exclusives set and the Raid Vault it feeds.
   *
   * Two things to pin down. The rescale has to land on the game's own rarity shape
   * without ever inverting the source's ordering, and the set has to stay out of
   * the five type tables — its creatures carry real types, so leaking is the easy
   * mistake.
   */
  group('exclusives: the rescaled set');
  {
    const ex = speciesOfSet('ex');
    const pool = DB.pools.get(VAULT_MODE);
    const flat = Object.values(pool).flat();

    check('the Vault is a set table', modeSet(VAULT_MODE) === 'ex', String(modeSet(VAULT_MODE)));
    check('and has no single type', modeType(VAULT_MODE) === null);

    /* ---- nothing at rarity 5 outside the boss file ---- */
    const stray = ex.filter(s => s.stage === 1 && s.rarity === 5 && !s.setBoss);
    check('no catchable Exclusive is left at Legendary', stray.length === 0,
          stray.map(s => s.name).join(','));
    check('the five legendaries are the ones filed as such',
          ex.filter(s => s.setBoss).length === 5, String(ex.filter(s => s.setBoss).length));

    /* ---- the rescale hits the intended shape ---- */
    const counts = [1, 2, 3, 4].map(r => (pool[r] || []).length);
    check('25 catchables in the Vault', counts.reduce((a, b) => a + b, 0) === 25,
          counts.join('+'));
    check('rescaled to 8/7/6/4', counts.join('/') === '8/7/6/4', counts.join('/'));
    note('Vault pool by rarity: ' + counts.join(' / ') +
         '  target shape ' + [1, 2, 3, 4].map(r => RARITY_SHAPE[r]).join(' / '));

    /* ---- and never inverts the source ordering ---- */
    let inversions = 0;
    for (const a of flat) {
      for (const b of flat) {
        if (a.rarity < b.rarity && a.sourceRarity > b.sourceRarity) inversions++;
      }
    }
    check('the source ordering is preserved', inversions === 0, String(inversions));

    const bySource = {};
    for (const s of flat) {
      const k = `src${s.sourceRarity}`;
      bySource[k] = bySource[k] || [];
      if (!bySource[k].includes(s.rarity)) bySource[k].push(s.rarity);
    }
    note('source rarity -> new rarity: ' +
         Object.keys(bySource).sort().map(k => `${k}->${bySource[k].sort().join(',')}`).join('  '));

    /* ---- the set stays out of the type tables ---- */
    for (const t of TYPES) {
      const leak = Object.values(DB.pools.get(t)).flat().filter(s => s.setKey === 'ex');
      check(`${t} does not draw Exclusives`, leak.length === 0,
            leak.map(s => s.name).join(','));
    }

    /* ---- and the Vault draws nothing else ---- */
    check('the Vault draws only Exclusives', flat.every(s => s.setKey === 'ex'),
          flat.filter(s => s.setKey !== 'ex').map(s => s.name).join(','));
    check('every type is represented in it',
          TYPES.every(t => flat.some(s => s.type === t)),
          TYPES.filter(t => !flat.some(s => s.type === t)).join(','));
    check('its pool is all first stages', flat.every(s => s.stage === 1));
    check('and excludes its own legendaries', !flat.some(s => s.setBoss));

    /* ---- rolling it produces only Exclusives, whatever the Galactic ladder says ---- */
    const seen = new Set();
    let bad = 0;
    for (let i = 0; i < 8000; i++) {
      const sp = rollEncounter(VAULT_MODE);
      if (!sp) { bad++; continue; }
      if (sp.setKey !== 'ex' || sp.stage !== 1 || sp.setBoss) { bad = -1; break; }
      seen.add(sp.id);
    }
    check('the Vault rolls only its own creatures', bad === 0, `bad=${bad}`);
    check('and reaches all 25 of them', seen.size === 25, `${seen.size}/25`);
    check('with no Galactic unlocks needed',
          rollEncounter(VAULT_MODE, { galacticRarities: [] }) !== null);
  }

  group('exclusives: five legendaries at one in five');
  {
    const all = allBossesForMode(VAULT_MODE);
    check('the Vault fields five legendaries', all.length === 5, String(all.length));
    check('one per type', TYPES.every(t => all.some(b => b.type === t)),
          all.map(b => b.type).join(','));
    check('all from the Exclusives set', all.every(b => b.setKey === 'ex'));
    check('all read as Legendary', all.every(b => b.effectiveRarity === 5));
    check('none of them promoted', all.every(b => b.promotedBoss === false),
          all.filter(b => b.promotedBoss).map(b => b.name).join(','));

    /* All five are available at once: the table itself was the thing to earn. */
    const locked = bossChoicesFor(VAULT_MODE, { galacticUnlocked: false });
    const open = bossChoicesFor(VAULT_MODE, { galacticUnlocked: true });
    check('all five are offered without any further unlock', locked.length === 5,
          String(locked.length));
    check('and the Galactic unlock is irrelevant here', open.length === 5);

    check('one in five each', Math.abs(bossOddsFor(5) - 0.2) < 1e-9, String(bossOddsFor(5)));
    check('and one in two on a type table', Math.abs(bossOddsFor(2) - 0.5) < 1e-9);
  }

  group('exclusives: the table has to be earned');
  {
    check(`the threshold is ${VAULT_UNLOCK_REGISTERED}`,
          VAULT_UNLOCK_REGISTERED === 100, String(VAULT_UNLOCK_REGISTERED));
    check('counted across the first two sets only',
          VAULT_UNLOCK_SETS.join() === 'ea,ga', VAULT_UNLOCK_SETS.join());
    check('99 is not enough', vaultUnlocked(99) === false);
    check('100 opens it', vaultUnlocked(100) === true);
    check('and more still does', vaultUnlocked(205) === true);
  }

  group('galactic bosses');
  {
    for (const t of TYPES) {
      const locked = bossChoicesFor(t, { galacticUnlocked: false });
      const open = bossChoicesFor(t, { galacticUnlocked: true });
      check(`${t}: locked, the gate offers one boss`, locked.length === 1, String(locked.length));
      check(`${t}: and it is the Awakening one`, locked[0]?.setKey === 'ea', locked[0]?.setKey);
      check(`${t}: unlocked, the gate offers two`, open.length === 2, String(open.length));
      check(`${t}: one from each set`,
            open.map(b => b.setKey).sort().join() === 'ea,ga',
            open.map(b => b.setKey).join());
    }
  }

  group('evolution graph');
  {
    const spiritfoil = speciesByName('Spiritfoil');
    const path = lineagePath(spiritfoil.id).map(s => s.name);
    check('Spiritfoil line is 3 long', path.length === 3, path.join(' > '));
    check('Spiritfoil > Nebulicorn > Wraithhorn',
          path.join('>') === 'Spiritfoil>Nebulicorn>Wraithhorn', path.join(' > '));

    const wraith = speciesByName('Wraithhorn');

    check('shiny mirrors the same filename', east.shinyPath === 'shiny/Antheara%20East.png', east.shinyPath);

    /**
     * Fetch every sprite: a 404 here is a blank creature on the table.
     *
     * In batches rather than all at once. There are over 400 now, and firing them
     * all as one Promise.all buries the single-threaded test server — it starts
     * refusing connections and the whole run dies on "Failed to fetch", which
     * looks exactly like a missing file and is not one.
     */
    const paths = DB.species.flatMap(sp => [sp.imagePath, sp.shinyPath]);

    /**
     * One HEAD per sprite, in small batches, and retried once.
     *
     * The test server is single-threaded. Firing 400-odd requests at it flat out
     * makes it start dropping connections, and a dropped connection surfaces as
     * "Failed to fetch" — indistinguishable from a genuinely missing file, and it
     * moved around between runs. Retrying separates the two: a real 404 fails
     * twice, a busy socket does not.
     */
    const head = async p => {
      try {
        const r = await fetch(p, { method: 'HEAD' });
        return r.ok ? null : `${p} (${r.status})`;
      } catch (e) {
        return `${p} (${e.message})`;
      }
    };

    const missing = [];
    for (let i = 0; i < paths.length; i += 8) {
      const results = await Promise.all(paths.slice(i, i + 8).map(head));
      for (let k = 0; k < results.length; k++) {
        if (!results[k]) continue;
        const again = await head(paths[i + k]);
        if (again) missing.push(again);
      }
    }
    check(`all ${paths.length} sprites present`, missing.length === 0,
          missing.slice(0, 6).join(', '));
  }

  group('physics: gravity and integration');
  {
    const w = new World({ gravity: 100 });

    for (let i = 0; i < 240; i++) w.step(PHYS_DT);        // one second

    check('vertical speed near g*t', near(b.vel.y, 97, 5), b.vel.y.toFixed(2));

  group('physics: bounce off a wall');
  {
    const w = new World({ gravity: 0 });

    const b = w.addBall(new Ball({ x: 50, y: 80 }));

  }

  group('physics: no tunnelling at speed');
  {
    // The whole reason for sub-stepping. At 400 u/s a 60 Hz frame moves the
    // ball 6.7 units, nearly three times its radius, straight through a
    // 0.6-thick wall.
    for (const speed of [150, 240, 300, MAX_SPEED]) {
      const w = new World({ gravity: 0 });
      w.add(
        segment(0, 0, 100, 0), segment(0, 180, 100, 180),
        segment(0, 0, 0, 180), segment(100, 0, 100, 180)
      );
      const b = w.addBall(new Ball({ x: 50, y: 90 }));
      b.setVel(speed * 0.8, speed * 0.6);

      let escaped = false;
      for (let i = 0; i < 240 * 12; i++) {
        w.step(PHYS_DT);
        if (b.pos.x < -1 || b.pos.x > 101 || b.pos.y < -1 || b.pos.y > 181) { escaped = true; break; }
      }
      check(`stays inside the box at ${speed} u/s`, !escaped,
            escaped ? `escaped to ${b.pos.x.toFixed(1)},${b.pos.y.toFixed(1)}` : '');
    }
  }

  /**
   * The bug this exists for: a fast glancing hit on the encounter creature
   * bounced but was not counted.
   *
   * Contact used to be decided by measuring the distance from the ball to the
   * creature once per animation frame. The shell that counts as a contact is
   * about a unit thick, so a shot that clips the edge at speed is inside it for
   * only a few milliseconds — less than a frame. Physics saw the contact,
   * because it runs at 240 Hz and sub-steps on top of that, and the frame sample
   * found the ball already gone.
   *
   * This asserts the property that fixes it: the solver reports every contact,
   * at any speed and any angle, with frames as coarse as the game ever uses.
   * The note records how many of the same shots a frame sample would have
   * missed, which is the size of the hole that was there.
   */
  group('physics: a glancing contact at speed is reported, not sampled');
  {
    /* The creature's real numbers, from Game._spawnCreatureCollider. */
    const RC = 11 * 0.72;
    const RB = 2.35;
    const reach = RB + RC;

    let shots = 0, reported = 0, sampleWouldMiss = 0;

    for (const b of [0.5, 3, 5, 7, 8.5, 9.4, 10.1]) {
      // Several sub-frame phases, because whether a frame boundary happens to
      // land inside the shell is pure luck — which is what made the bug
      // intermittent rather than obvious.
      for (const phase of [0, 0.27, 0.51, 0.78]) {
        const w = new World({ gravity: 0 });
        const c = circle(0, 0, RC, { restitution: 0.5, friction: 0.05, kick: 26, cooldownFor: 0.22 });
        w.add(c);

        const speed = MAX_SPEED;
        const frameTravel = speed / 60;
        const ball = w.addBall(new Ball({ x: b, y: 40 + phase * frameTravel, r: RB }));
        ball.setVel(0, -speed);

        let sawEvent = false, sawSample = false;
        for (let f = 0; f < 24; f++) {
          w.advance(1 / 60);                       // one 60 Hz frame, as main.js does
          if (w.drainEvents().some(e => e.type === 'hit' && e.collider === c)) sawEvent = true;
          if (Math.hypot(ball.pos.x, ball.pos.y) <= reach + 0.6) sawSample = true;
        }

        shots++;
        if (sawEvent) reported++;
        if (sawEvent && !sawSample) sampleWouldMiss++;
      }
    }

    check('every glancing contact is reported', reported === shots, `${reported} of ${shots}`);
    note(`frame sampling would have missed ${sampleWouldMiss} of ${shots} of the same shots`);
  }

  /**
   * A ball must never park on a slope.
   *
   * Coulomb friction has a static regime, and with the flipper's rubber it
   * reaches 30 degrees: the ball simply stopped on a lowered bat, on a target
   * face, in the crook of a funnel. On a table where gravity *is* the incline
   * that is wrong — a tilted surface has to keep the ball creeping. See
   * ROLLING_GRIP in physics.js.
   */
  group('physics: nothing holds the ball on a slope');
  {
    const slid = [];
    for (const deg of [2, 5, 10, 20, 35]) {
      for (const [what, friction, restitution] of [['wall', 0.05, 0.42], ['rubber', 0.5, 0.15]]) {
        const w = new World({ gravity: 132 });
        const rad = deg * Math.PI / 180;
        const len = 60;
        // A long slope through (50, 90), descending to the right.
        w.add(segment(
          50 - Math.cos(rad) * len / 2, 90 - Math.sin(rad) * len / 2,
          50 + Math.cos(rad) * len / 2, 90 + Math.sin(rad) * len / 2,
          { friction, restitution }
        ));
        const ball = w.addBall(new Ball({ x: 50, y: 90 - 3 }));
        const x0 = ball.pos.x;
        for (let i = 0; i < 240 * 3; i++) w.step(PHYS_DT);   // three seconds
        const moved = ball.pos.x - x0;
        slid.push(`${what}@${deg}:${moved.toFixed(1)}`);
        check(`a ${what} at ${deg} degrees does not hold it`, moved > 4, moved.toFixed(2));
      }
    }
    note(slid.join(' '));
  }

  group('physics: arc contains the ball');
  {
    const w = new World({ gravity: 0 });
    w.add(arc(50, 90, 40, 0, Math.PI * 2, { restitution: 0.8, friction: 0 }));
    const b = w.addBall(new Ball({ x: 50, y: 90 }));
    b.setVel(210, 130);
    let escaped = false;
    for (let i = 0; i < 240 * 8; i++) {
      w.step(PHYS_DT);
      if (vdist(b.pos, vec(50, 90)) > 41) { escaped = true; break; }
    }
    check('ball stays inside the ring', !escaped, `r=${vdist(b.pos, vec(50, 90)).toFixed(2)}`);
  }

  group('physics: bumper kick');
  {
    const w = new World({ gravity: 0 });
    w.add(circle(50, 60, 4, { restitution: 0.3, kick: 60 }));
    const b = w.addBall(new Ball({ x: 50, y: 80 }));
    b.setVel(0, -40);

  group('physics: flipper throws the ball');
  {
    const w = new World({ gravity: 0 });
    const f = w.addFlipper(new Flipper({
      pivot: { x: 34, y: 158 }, length: 17, thick: 1.9,

    check('flipper reached its stop', near(f.angle, f.endAngle, 1e-6));

    note(`launch speed ${b.speed.toFixed(1)} u/s`);

  group('physics: tip beats base');
  {
    // A real flipper throws harder near the tip, because omega x r grows with r.
    //
    // The ball has to be placed from the bat's own geometry, not guessed: an
    // earlier version of this test put it at (pivot.x + along, pivot.y + along
    // * 0.45), which is nowhere near a bat sitting at 0.42 rad. The flipper
    // swung straight past it and both "launches" were 0.0, which looked like
    // an engine failure and was not one.
    const launch = along => {
      const w = new World({ gravity: 0 });
      const f = w.addFlipper(new Flipper({
        pivot: { x: 34, y: 158 }, length: 17, thick: 1.9,
        restAngle: 0.42, range: -0.95, side: 'left'
      }));
      const b = w.addBall(new Ball({}));

      // Along the bat, then off its upper face by exactly the contact distance.
      const dx = Math.cos(f.restAngle), dy = Math.sin(f.restAngle);
      const gap = b.r + f.thick;
      b.moveTo(
        f.pivot.x + dx * along + dy * gap,
        f.pivot.y + dy * along - dx * gap
      );

      f.up = true;
      for (let i = 0; i < 90; i++) w.step(PHYS_DT);
      return b.speed;
    };

    const atBase = launch(6), atTip = launch(16);
    check('the base launches the ball at all', atBase > 5, atBase.toFixed(1));
    check('tip launches harder than the base', atTip > atBase,
          `base ${atBase.toFixed(1)} vs tip ${atTip.toFixed(1)}`);

    // A designed range, not just "did not explode". Reaching the top of the
    // table from the flippers needs about 180 u/s, so the tip shot must clear
    // that; and it must stay well under the clamp, or every shot becomes the
    // same maximum shot and aiming stops mattering.
    check('a full tip shot reaches the top of the table', atTip > 200, atTip.toFixed(1));
    check('a full tip shot is not a rocket', atTip < 285, atTip.toFixed(1));
    check('the clamp is never the thing limiting a shot', atTip < MAX_SPEED * 0.88,
          `${atTip.toFixed(1)} vs clamp ${MAX_SPEED}`);

    // The spread is the point: where the ball sits on the bat is a skill.
    //
    // It is smaller than the naive omega x r ratio (16/6, so nearly 3x) because
    // the bat's tangential friction is low and the ball slides outward along it
    // during the swing, so a base contact is partly thrown from further out by
    // the time it leaves. That is correct behaviour and worth keeping â€” a real
    // flipper sweeps a ball up the bat the same way â€” so the check is that a
    // useful spread exists, not that it matches the arithmetic.
    check('base and tip shots differ usefully', atTip > atBase * 1.3,
          `${atBase.toFixed(1)} -> ${atTip.toFixed(1)}, ratio ${(atTip / atBase).toFixed(2)}`);
    note(`launch at base ${atBase.toFixed(1)} u/s, at tip ${atTip.toFixed(1)} u/s`);
  }

  group('physics: rotor');
  {
    // A rotor shares Flipper's surface, so it must resolve through the same
    // path and impart its angular velocity the same way.
    const w = new World({ gravity: 0 });
    const r = w.addRotor(new Rotor({ pivot: { x: 50, y: 90 }, length: 10, thick: 1.6, omega: 9 }));
    check('a rotor lands in bats and rotors, not flippers',

    const before = r.angle;

    // Sitting still just off the hub, the arm must come round and throw it.

    let moved = false;
    for (let i = 0; i < 240 && !moved; i++) { w.step(PHYS_DT); if (b.speed > 20) moved = true; }
    check('a rotor throws a resting ball', moved, `speed ${b.speed.toFixed(1)}`);
    check('a rotor cannot exceed the clamp', b.speed <= MAX_SPEED + 1e-6, b.speed.toFixed(1));

    // Both arms are live, so a ball on the far side is struck too.
    const w2 = new World({ gravity: 0 });
    w2.addRotor(new Rotor({ pivot: { x: 50, y: 90 }, length: 10, thick: 1.6, omega: 9, angle: 0 }));
    const far = w2.addBall(new Ball({ x: 50, y: 98 }));   // opposite side from the first test
    let hit = false;
    for (let i = 0; i < 240 && !hit; i++) { w2.step(PHYS_DT); if (far.speed > 20) hit = true; }
    check('a rotor is double-ended', hit, `speed ${far.speed.toFixed(1)}`);

    // Flippers must still report as flippers now that both share a path.
    const w3 = new World({ gravity: 0 });
    const f = w3.addFlipper(new Flipper({
      pivot: { x: 34, y: 158 }, restAngle: 0.42, range: -0.95, side: 'left'
    }));
    const fb = w3.addBall(new Ball({}));
    const dx = Math.cos(f.restAngle), dy = Math.sin(f.restAngle);
    const gap = fb.r + f.thick;
    fb.moveTo(f.pivot.x + dx * 14 + dy * gap, f.pivot.y + dy * 14 - dx * gap);
    f.up = true;
    for (let i = 0; i < 60; i++) w3.step(PHYS_DT);
    const kinds = new Set(w3.drainEvents().map(e => e.type));
    check('flipper contacts still report as "flipper"', kinds.has('flipper'), [...kinds].join(','));
  }

  group('physics: sensors, gates and fields');
  {
    const w = new World({ gravity: 0 });
    let hits = 0;
    w.add(sensorCircle(50, 60, 5, { onHit: () => hits++, cooldownFor: 0.05 }));
    const b = w.addBall(new Ball({ x: 50, y: 100 }));
    b.setVel(0, -80);
    for (let i = 0; i < 240; i++) w.step(PHYS_DT);
    check('sensor fired', hits >= 1, `${hits} hits`);
    check('sensor did not deflect the ball', b.vel.y < 0 && near(b.vel.x, 0, 1e-6),
          `v=${b.vel.x.toFixed(2)},${b.vel.y.toFixed(2)}`);

    const wUp = new World({ gravity: 0 });
    wUp.add(segment(30, 60, 70, 60, { oneWay: { x: 0, y: -1 } }));
    const up = wUp.addBall(new Ball({ x: 50, y: 70 }));
    up.setVel(0, -60);
    for (let i = 0; i < 120; i++) wUp.step(PHYS_DT);
    check('gate passes a ball travelling up', up.pos.y < 58, up.pos.y.toFixed(2));

    const wDown = new World({ gravity: 0 });
    wDown.add(segment(30, 60, 70, 60, { oneWay: { x: 0, y: -1 }, restitution: 0.5 }));
    const down = wDown.addBall(new Ball({ x: 50, y: 50 }));
    down.setVel(0, 60);
    for (let i = 0; i < 120; i++) wDown.step(PHYS_DT);
    check('gate blocks it coming back down', down.pos.y < 60, down.pos.y.toFixed(2));

    const wLift = new World({ gravity: 100 });
    wLift.add(field(0, 0, 100, 180, 0, -260));
    const lift = wLift.addBall(new Ball({ x: 50, y: 90 }));
    for (let i = 0; i < 120; i++) wLift.step(PHYS_DT);
    check('field lifts the ball against gravity', lift.pos.y < 90, lift.pos.y.toFixed(2));
  }

  group('physics: cooldown stops score spam');
  {
    const w = new World({ gravity: 100 });
    let hits = 0;
    w.add(segment(30, 120, 70, 120, { restitution: 0.05, onHit: () => hits++, cooldownFor: 0.1 }));
    w.addBall(new Ball({ x: 50, y: 100 }));
    for (let i = 0; i < 240 * 3; i++) w.step(PHYS_DT);   // three seconds
    check('a resting ball does not machine-gun a target', hits <= 32, `${hits} hits in 3s`);
    check('the target did fire at least once', hits >= 1, `${hits}`);
  }

  group('physics: nudge and tilt');
  {
    const w = new World({ gravity: 0 });
    const b = w.addBall(new Ball({ x: 50, y: 90 }));
    check('nudge allowed under the limit', w.applyNudge(-40, 0) === true);
    for (let i = 0; i < 30; i++) w.step(PHYS_DT);
    check('nudge moved the ball left', b.pos.x < 50, b.pos.x.toFixed(2));

    const w2 = new World({ gravity: 0 });
    w2.addBall(new Ball({ x: 50, y: 90 }));
    let allowed = 0;
    for (let i = 0; i < 10; i++) if (w2.applyNudge(-30, 0)) allowed++;
    check('leaning on nudge tilts the table', w2.tilted === true, `allowed ${allowed}`);
    check('nudge refused once tilted', w2.applyNudge(-30, 0) === false);
    w2.resetTilt();
    check('resetTilt clears it', w2.tilted === false && w2.tilt === 0);
  }

  group('physics: advance() is frame-rate independent');
  {
    // One simulated second, delivered as N frames of 1/N. Frame counts are
    // exact integers on purpose: accumulating `t += frameDt` until `t >= 1`
    // overshoots at 30 Hz because 30 * (1/30) lands a hair under 1 in floating
    // point, giving a 31st frame. That made the engine look frame-rate
    // dependent when the extra fall was entirely the test's own doing.
    const fall = hz => {
      const w = new World({ gravity: 100 });
      const b = w.addBall(new Ball({ x: 50, y: 10 }));
      for (let i = 0; i < hz; i++) w.advance(1 / hz);
      return { y: b.pos.y, steps: w.steps };
    };

    const a30 = fall(30), a60 = fall(60), a120 = fall(120);
    note(`steps taken: 30Hz=${a30.steps}  60Hz=${a60.steps}  120Hz=${a120.steps}`);

    // One second at 240 Hz is 240 steps however it is sliced, give or take a
    // single step of floating-point drift in the accumulator.
    for (const [label, r] of [['30Hz', a30], ['60Hz', a60], ['120Hz', a120]]) {
      check(`${label} takes ~240 steps for one second`, Math.abs(r.steps - 240) <= 1, String(r.steps));
    }

    // A one-step discrepancy at ~97 u/s is 0.4 units, so anything inside half
    // a unit means the frame rate genuinely did not matter.
    check('30 Hz and 60 Hz agree', near(a30.y, a60.y, 0.5), `${a30.y.toFixed(3)} vs ${a60.y.toFixed(3)}`);
    check('60 Hz and 120 Hz agree', near(a60.y, a120.y, 0.5), `${a60.y.toFixed(3)} vs ${a120.y.toFixed(3)}`);

    // A long stall must not fast-forward the ball into the drain.
    const wStall = new World({ gravity: 100 });
    const stalled = wStall.addBall(new Ball({ x: 50, y: 10 }));
    wStall.advance(5);                       // five seconds in one frame
    check('a long stall is capped, not replayed', wStall.steps <= 12, String(wStall.steps));
    check('the ball barely moved during the stall', stalled.pos.y - 10 < 1, (stalled.pos.y - 10).toFixed(3));
  }

  group('physics: events drain once');
  {
    const w = new World({ gravity: 0 });
    w.add(circle(50, 60, 4, { kick: 20 }));
    const b = w.addBall(new Ball({ x: 50, y: 80 }));
    b.setVel(0, -60);
    for (let i = 0; i < 120; i++) w.step(PHYS_DT);
    check('events were produced', w.events.length > 0, `${w.events.length}`);
    const first = w.drainEvents();
    check('drain returned them', first.length > 0);
    check('draining twice yields nothing', w.drainEvents().length === 0);
  }

  /* =====================================================
     Table geometry
     ===================================================== */
  group('table: builds for every mode');
  {
    for (const t of MODE_KEYS) {
      const { world, parts, mode } = buildTable(t);
      check(`${t} builds`, !!world && !!parts.flippers && !!parts.saucer);
      check(`  ${t} uses the ${MODES[t].gimmick} gimmick`, parts.gimmick.id === MODES[t].gimmick,
            parts.gimmick.id);
      check(`  ${t} has 5 bank targets`, parts.bank.length === 5);
      check(`  ${t} has 3 bumpers and 3 top lanes`,
            parts.bumpers.length === 3 && parts.topLanes.length === 3);
      check(`  ${t} has 2 ramps, 2 slingshots, 2 outlanes`,
            parts.ramps.length === 2 && parts.slingshots.length === 2 && parts.outlanes.length === 2);
      check(`  ${t} gimmick update/reset do not throw`, (() => {
        try { parts.gimmick.update(0.016); parts.gimmick.reset(); return true; }
        catch { return false; }
      })());
      note(`${t}: ${mode.name} â€” ${world.colliders.length} colliders, ` +
           `${world.bats.length} bats, ${world.fields.length} fields`);
    }
  }

  group('table: the drain gap');
  {
    const { parts } = buildTable('Neutral');
    const lt = parts.flippers.left.tip, rt = parts.flippers.right.tip;
    const ball = new Ball({});
    const dia = ball.r * 2;

    /**
     * The number that matters is the CLEAR opening, not the distance between
     * tip centres. A flipper is a capsule, so each tip eats `thick` of the
     * gap. An earlier version of this check compared centre distance against
     * the ball diameter, passed happily at 6.0 vs 4.7, and never noticed that
     * the real opening was 6.0 - 3.8 = 2.2 and the drain was sealed shut.
     */
    const centres = rt.x - lt.x;
    const clear = centres - 2 * LAYOUT.flippers.thick;

    check('the flipper tips leave a gap', centres > 0, centres.toFixed(2));
    check('the clear opening passes a ball', clear > dia,
          `clear ${clear.toFixed(2)} vs ball ${dia.toFixed(2)}`);
    check('the opening is about a ball and a bit', clear > dia * 1.15 && clear < dia * 1.7,
          `${(clear / dia).toFixed(2)} ball widths`);
    check('the gap is centred on the play area',
          Math.abs((lt.x + rt.x) / 2 - LAYOUT.centre) < 0.6,
          `${((lt.x + rt.x) / 2).toFixed(2)} vs ${LAYOUT.centre}`);

    // A raised flipper must not reach into its slingshot.
    for (const [side, sling] of [['left', LAYOUT.slingshots[0]], ['right', LAYOUT.slingshots[1]]]) {
      const f = parts.flippers[side];
      f.up = true;
      f.angle = f.endAngle;
      const tip = f.tip;
      const d = Math.hypot(tip.x - sling.b.x, tip.y - sling.b.y);
      check(`${side} flipper clears its slingshot when raised`, d > ball.r + 1.2 + LAYOUT.flippers.thick,
            d.toFixed(2));
      f.up = false;
      f.angle = f.restAngle;
    }

    // The dividers have to stop closer to each pivot than a ball is wide, or
    // the ball slips behind the flipper straight into the drain.
    for (const [side, d, pivot] of [
      ['left', LAYOUT.lower.leftDivider, LAYOUT.flippers.left.pivot],
      ['right', LAYOUT.lower.rightDivider, LAYOUT.flippers.right.pivot]
    ]) {
      const dist = Math.hypot(d.b.x - pivot.x, d.b.y - pivot.y);
      check(`${side} divider closes the gap to its pivot`, dist < ball.r * 2,
            `${dist.toFixed(2)} vs ${(ball.r * 2).toFixed(2)}`);
    }
  }

  group('table: the plunge leaves the shooter lane');
  {
    const { world, parts } = buildTable('Mystic');
    const b = world.addBall(newBall());
    check('a new ball starts held in the lane', b.held === true && b.pos.x > LAYOUT.shooter.x0);

    b.held = false;
    b.setVel(0, -launchImpulse(1));
    /**
     * Stopped at the drain, because past it there is nothing left to test. The
     * real game takes the ball out of play there; carrying on simulating means
     * watching a drained ball free-fall out of the bottom of the world and then
     * wander sideways, which is not an escape from the table by any useful
     * definition. That false positive is exactly what this used to report.
     */
    let reachedPlay = false, escaped = false;
    for (let i = 0; i < 240 * 6; i++) {
      world.step(PHYS_DT);
      if (b.pos.x < LAYOUT.shooter.x0 - 2) reachedPlay = true;
      if (b.pos.y > LAYOUT.drainY) break;
      if (b.pos.x < -1 || b.pos.x > TABLE_W + 1 || b.pos.y < -1) { escaped = true; break; }
    }
    check('a full plunge reaches the playfield', reachedPlay,
          `ended at ${b.pos.x.toFixed(1)},${b.pos.y.toFixed(1)}`);
    check('the ball never leaves the table', !escaped,
          escaped ? `escaped at ${b.pos.x.toFixed(1)},${b.pos.y.toFixed(1)} ` +
                    `v ${b.vel.x.toFixed(0)},${b.vel.y.toFixed(0)}` : '');

    // Even the softest plunge must get out of the lane, or the control reads
    // as broken rather than gentle.
    const soft = buildTable('Mystic');
    const sb = soft.world.addBall(newBall());
    sb.held = false;
    sb.setVel(0, -launchImpulse(0));
    let cleared = false;
    for (let i = 0; i < 240 * 8; i++) {
      soft.world.step(PHYS_DT);
      if (sb.pos.x < LAYOUT.shooter.x0 - 2) { cleared = true; break; }
    }
    check('the softest plunge still reaches the playfield', cleared,
          `ended at ${sb.pos.x.toFixed(1)},${sb.pos.y.toFixed(1)}`);
    check('launchImpulse is monotonic',
          [0, 0.25, 0.5, 0.75, 1].every((p, i, a) => i === 0 || launchImpulse(p) > launchImpulse(a[i - 1])));

    // The gate is vertical and lets the ball out to the left only.
    check('the gate is vertical', parts.laneGate.a.x === parts.laneGate.b.x);
    check('the gate opens leftwards', parts.laneGate.oneWay?.x === -1);

    // And it must actually turn back a ball rolling in off the dome.
    const back = buildTable('Mystic');
    const bb = back.world.addBall(new Ball({ x: LAYOUT.shooter.x0 - 6, y: 30 }));
    bb.setVel(90, 10);                                  // heading right, into the lane
    for (let i = 0; i < 240 * 4; i++) back.world.step(PHYS_DT);
    check('a ball cannot get back into the shooter lane', bb.pos.x < LAYOUT.shooter.x0,
          `x ${bb.pos.x.toFixed(1)}`);
  }

  group('table: nothing gets stuck');
  {
    /**
     * The geometry test that matters. A ball that comes to rest somewhere
     * with the flippers idle is a dead game, and it is very easy to build a
     * pocket that does it â€” on top of a lane divider, behind a slingshot, in
     * the mouth of a gimmick. So: drop a spread of balls across every mode,
     * let them fall with the flippers down, and require every one to drain.
     */
    // Inside the dome only. Above y = dome.cy the playfield is bounded by the
    // arc, not by the side walls, so a grid corner like (7,14) sits outside
    // the table entirely â€” far enough from the arc that an overlap test calls
    // it clear, and it then "escapes" through a wall that was never there.
    const D = LAYOUT.dome;
    const insideTable = (x, y) =>
      y >= D.cy ? (x > LAYOUT.left + 4 && x < LAYOUT.right - 4)
                : Math.hypot(x - D.cx, y - D.cy) < D.r - 4;

    const spots = [];
    for (let x = 7; x <= 78; x += 6) {
      for (let y = 14; y <= 152; y += 12) {
        if (insideTable(x, y)) spots.push({ x, y });
      }
    }
    check('the drop grid has a decent spread', spots.length > 60, `${spots.length} points`);

    /**
     * Only drop from somewhere the ball could actually be. A spawn point
     * inside a wall gets shoved out by position correction and can be flung
     * off the table, which reads as an escape bug that is not one.
     *
     * Rather than reimplement the overlap maths, ask the world: with no
     * gravity and no velocity, the only thing that can move the ball is a
     * position correction, so any movement at all means it was overlapping.
     */
    // One probe world per mode rather than one per point: building a table is
    // the expensive part, and this check only cares about static geometry.
    // Rotors are parked, since whether an arm happens to be in the way is
    // transient and their hubs are static colliders anyway.
    const probeWorld = type => {
      const { world } = buildTable(type);
      world.gravity = 0;
      world.rotors.forEach(r => { r.active = false; });
      return world;
    };

    const isClear = (world, spot) => {
      const probe = world.addBall(new Ball({ x: spot.x, y: spot.y }));
      world.step(PHYS_DT);
      const moved = Math.hypot(probe.pos.x - spot.x, probe.pos.y - spot.y);
      world.removeBall(probe);
      return moved < 1e-6;
    };

    let totalStuck = 0, totalEscaped = 0, totalTested = 0, totalSkipped = 0;

    for (const t of MODE_KEYS) {
      const stuck = [];
      const escapes = [];
      const probe = probeWorld(t);

      for (const spot of spots) {
        if (!isClear(probe, spot)) { totalSkipped++; continue; }

        const { world, parts } = buildTable(t);
        const b = world.addBall(new Ball({ x: spot.x, y: spot.y }));
        // A little sideways drift, so a ball balanced on a rounded cap is not
        // rescued by perfect symmetry.
        b.setVel(((spot.x * 7) % 5 - 2) * 8, 4);

        let drained = false, left = false;
        for (let i = 0; i < 240 * 20; i++) {          // 20 simulated seconds
          world.step(PHYS_DT);
          // Drive the gimmick, exactly as game.js does. Without this the Gale
          // Spire's updraught never switches off, and a ball can hover
          // indefinitely balanced on the edge of the lift â€” a trap that cannot
          // happen in the real game, where the gust comes and goes.
          parts.gimmick.update(PHYS_DT);
          if (b.pos.y > LAYOUT.drainY) { drained = true; break; }
          if (b.pos.x < -2 || b.pos.x > TABLE_W + 2 || b.pos.y < -2) { left = true; break; }
        }

        /**
         * A ball at rest on an idle flipper is not stuck â€” cradling the ball
         * on the bat is a real pinball technique, and raising the flipper's
         * friction to rubber levels is what makes it possible. What matters is
         * that the player can always get it moving again, so anything still on
         * the table gets the flippers worked for a few seconds. Only a ball
         * that ignores that is genuinely lost.
         */
        let recovered = false;
        if (!drained && !left) {
          const before = { x: b.pos.x, y: b.pos.y };
          for (let i = 0; i < 240 * 8 && !recovered; i++) {
            if (i % 60 === 0) {
              const on = (i / 60) % 2 === 0;
              parts.flippers.left.up = on;
              parts.flippers.right.up = on;
            }
            world.step(PHYS_DT);
            parts.gimmick.update(PHYS_DT);
            if (b.pos.y > LAYOUT.drainY) { recovered = true; drained = true; }
            else if (Math.hypot(b.pos.x - before.x, b.pos.y - before.y) > 10) recovered = true;
          }
        }

        totalTested++;
        if (left) escapes.push(`(${spot.x},${spot.y})->(${b.pos.x.toFixed(0)},${b.pos.y.toFixed(0)})`);
        else if (!drained && !recovered) {
          stuck.push(`(${spot.x},${spot.y})->(${b.pos.x.toFixed(0)},${b.pos.y.toFixed(0)})`);
        }
      }

      totalStuck += stuck.length;
      totalEscaped += escapes.length;
      check(`${t}: every ball drains`, stuck.length === 0, stuck.slice(0, 6).join(' '));
      check(`${t}: no ball escapes the table`, escapes.length === 0, escapes.slice(0, 4).join(' '));
    }

    note(`${totalTested} drops across ${MODE_KEYS.length} modes ` +
         `(${totalSkipped} spawn points skipped as blocked): ` +
         `${totalStuck} stuck, ${totalEscaped} escaped`);
  }

  group('table: flippers can actually save the ball');
  {
    const { world, parts } = buildTable('Neutral');
    const f = parts.flippers.left;

    /**
     * The ball is placed on the bat from the bat's own geometry rather than
     * dropped from above and left to settle. Dropping works, but the ball then
     * rolls down the bat, off the tip and through the drain in well under a
     * second â€” so any fixed wait long enough to "settle" is also long enough
     * to lose it, and the flip then appears to do nothing.
     */
    const b = world.addBall(new Ball({}));
    /**
     * 80% of the way out, which is where a cradled ball actually sits: the bat
     * slopes down towards its tip, so a ball that lands on it settles near the
     * end.
     *
     * It matters more than it looks. Launch speed is omega x r x (1 + e), so at
     * the tip the ball leaves at about 232 u/s against a tip travelling at 238
     * â€” it outruns the bat and is gone. Placed halfway along it only leaves at
     * 137, the tip catches it again late in the swing when the bat has rotated
     * past horizontal, and that second hit fires it sideways at 237 u/s instead
     * of up the table. Authentic, and exactly why you do not want the ball on
     * the base of the bat, but not what "can a flipper save the ball" means.
     */
    const along = f.length * 0.8;
    const dx = Math.cos(f.restAngle), dy = Math.sin(f.restAngle);
    const gap = b.r + f.thick;

    // Dropped a little clear of the face and allowed to settle, rather than
    // placed exactly tangent. Exact tangency means depth 0, the solver's
    // `d >= rad` test skips the contact, and the first real contact is a
    // glancing one part way through the swing â€” so the ball gets carried up
    // by the bat instead of thrown by it, which reads as the flipper failing.
    b.moveTo(f.pivot.x + dx * along + dy * (gap + 3), f.pivot.y + dy * along - dx * (gap + 3));

    /**
     * Long enough to land on the bat, not long enough to roll off it.
     *
     * A lowered bat slopes down towards its tip, and a ball no longer parks on a
     * slope — it rolls, which is the whole point of ROLLING_GRIP. So there is no
     * "settled on the bat" state to wait for with the flipper down, and waiting
     * for one only lets the ball reach the tip and leave. A player flips as the
     * ball arrives, so the test does too. Cradling is a *raised* bat, which is a
     * different shot and is covered by the recovery loop in "nothing gets stuck".
     */
    for (let i = 0; i < 12; i++) world.step(PHYS_DT);

    check('the ball lands on the bat, above the drain',
          b.pos.y < LAYOUT.drainY && b.pos.y > 140,
          `y ${b.pos.y.toFixed(1)} speed ${b.speed.toFixed(1)}`);
    check('and is rolling on it rather than falling past it', b.speed < 60,
          b.speed.toFixed(1));

    const yBefore = b.pos.y;
    note(`save: ball rests at (${b.pos.x.toFixed(1)}, ${b.pos.y.toFixed(1)})`);

    f.up = true;

    // Track the best of the whole flight, and where the ball was when it was
    // moving fastest. Sampling one instant catches it wherever it happens to
    // be, which may be on its way back down; and knowing where the peak
    // happened is what identifies whatever it went on to hit.
    let peakSpeed = 0, peakAt = null, highest = yBefore, highestAt = null;
    const trace = [];
    for (let i = 0; i < 240 * 2; i++) {
      // Released after 120 ms, the way a player taps it. Holding the bat up for
      // the whole flight leaves a pocket between the raised bat and the inlane
      // divider that the ball can drop into and sit in.
      if (i === 29) f.up = false;
      world.step(PHYS_DT);
      if (b.speed > peakSpeed) { peakSpeed = b.speed; peakAt = { x: b.pos.x, y: b.pos.y }; }
      if (b.pos.y < highest) { highest = b.pos.y; highestAt = { x: b.pos.x, y: b.pos.y }; }
      if (i % 12 === 0 && trace.length < 10) trace.push(`${b.pos.x.toFixed(0)},${b.pos.y.toFixed(0)}`);
      if (b.pos.y > LAYOUT.drainY) break;
    }

    note(`save: peak ${peakSpeed.toFixed(0)} u/s at ` +
         `(${peakAt ? peakAt.x.toFixed(1) + ',' + peakAt.y.toFixed(1) : '-'}), ` +
         `highest y ${highest.toFixed(1)} at x ${highestAt ? highestAt.x.toFixed(1) : '-'}`);
    note(`save: path ${trace.join(' -> ')}`);

    check('the flip launches it with real speed', peakSpeed > 130, peakSpeed.toFixed(1));
    check('the save clears the lower third', highest < yBefore - 60,
          `${yBefore.toFixed(1)} -> ${highest.toFixed(1)}`);
    check('the save reaches the upper playfield', highest < 100, highest.toFixed(1));
  }

  group('table: bank targets drop and reset');
  {
    const { world, parts } = buildTable('Wind');
    check('every target starts standing', parts.bank.every(t => t.active));
    check('the bank spells CATCH', parts.bank.map(t => t.meta.letter).join('') === 'CATCH',
          parts.bank.map(t => t.meta.letter).join(''));

    // An inactive target must be genuinely absent, not merely unscored.
    parts.bank.forEach(t => { t.active = false; });
    const b = world.addBall(new Ball({ x: LAYOUT.bank.xs[2], y: LAYOUT.bank.y - 12 }));
    b.setVel(0, 60);
    for (let i = 0; i < 240; i++) world.step(PHYS_DT);
    check('a dropped target no longer blocks the ball', b.pos.y > LAYOUT.bank.y + 4,
          `y ${b.pos.y.toFixed(1)}`);
  }

  group('table: the Well is a sensor, not a wall');
  {
    const { world, parts } = buildTable('Celestial');
    check('the saucer is a sensor', parts.saucer.sensor === true);

    let entered = 0;
    parts.saucer.onHit = () => entered++;
    const b = world.addBall(new Ball({ x: LAYOUT.saucer.x, y: LAYOUT.saucer.y - 14 }));
    b.setVel(0, 50);
    for (let i = 0; i < 120; i++) world.step(PHYS_DT);
    check('the ball reaches the Well', entered >= 1, `${entered}`);
    check('and passes through rather than bouncing off', b.pos.y > LAYOUT.saucer.y,
          `y ${b.pos.y.toFixed(1)}`);
  }

  group('table: gimmick behaviour');
  {
    // Bloom vines must regrow, or clearing them once ends the mode forever.
    const bloom = buildTable('Celestial').parts.gimmick;
    check('vines start grown', bloom.vines.every(v => v.active));
    check('cutting a vine works', bloom.cut(0) === true && bloom.vines[0].active === false);
    check('cutting an already cut vine is refused', bloom.cut(0) === false);
    for (let i = 0; i < 60; i++) bloom.update(0.05);          // 3 s
    check('a cut vine is still down after 3s', bloom.vines[0].active === false);
    for (let i = 0; i < 100; i++) bloom.update(0.05);         // 8 s total
    check('a cut vine regrows', bloom.vines[0].active === true);

    // The updraught has to switch off, or the table becomes a holding pattern.
    const up = buildTable('Wind').parts.gimmick;
    const seen = new Set();
    for (let i = 0; i < 400; i++) { up.update(0.02); seen.add(up.state.on); }
    check('the updraught gusts on and off', seen.has(true) && seen.has(false));
    check('the field follows the gust', up.fields[0].active === up.state.on);

    // Gears must wind up with heat and settle back down.
    const gears = buildTable('Mechanic').parts.gimmick;
    const idle = Math.abs(gears.rotors[0].omega);
    gears.state.heat = 4;
    gears.update(0.016);
    check('heat speeds the gears up', Math.abs(gears.rotors[0].omega) > idle,
          `${idle} -> ${Math.abs(gears.rotors[0].omega).toFixed(2)}`);
    check('the gears turn against each other',
          Math.sign(gears.rotors[0].omega) !== Math.sign(gears.rotors[1].omega));
    for (let i = 0; i < 800; i++) gears.update(0.02);
    check('heat bleeds off', gears.state.heat === 0, String(gears.state.heat));

    // The rune disc must accelerate as the mode heats.
    const orbit = buildTable('Mystic').parts.gimmick;
    const slow = orbit.rotors[0].omega;
    orbit.state.spins = 12;
    orbit.update(0.016);
    check('the rune disc speeds up with spins', orbit.rotors[0].omega > slow,
          `${slow} -> ${orbit.rotors[0].omega.toFixed(2)}`);
    orbit.reset();
    check('reset returns the disc to its base speed', orbit.rotors[0].omega === slow);
  }

  /**
   * Stage a contact the way the solver does.
   *
   * Creature hits are queued by Game._handleEvents from the physics event list
   * and drained by whichever mode is running, so a test that wants "the ball
   * hit it" has to put a contact in the queue. Moving the ball on top of the
   * creature is no longer enough, and that is the point of the change: nothing
   * about a position at a frame boundary decides whether a hit landed.
   */
  const strike = g => { g._creatureHits.push({ x: g.sub.x, y: g.sub.y }); };

  group('game: encounter and capture');
  {
    const events = [];
    const g = new Game({ onEvent: (t, p) => events.push({ t, p }) });
    g.start('Mechanic');
    g.plungeRelease();

    g.run.encounterArmed = true;
    g._enterSaucer(g.ball);
    g._lastNow = 200000;
    g._updateSaucer(200000);

    check('the encounter starts', g.phase === PHASE.ENCOUNTER, g.phase);
    check('a creature of the right type appeared',
          g.sub?.sp?.type === 'Mechanic', g.sub?.sp?.type);
    check('it is a stage 1 catchable', g.sub.sp.stage === 1 && g.sub.sp.effectiveRarity < 5);
    check('the meter is sized by rarity',
          g.sub.meterMax === CAPTURE_METER[g.sub.sp.effectiveRarity], String(g.sub.meterMax));
    check('a collider was spawned for it', !!g.sub.collider);
    check('the collider is in the world', g.world.colliders.includes(g.sub.collider));
    check('encounterStart fired', events.some(e => e.t === 'encounterStart'));
    check('the arm was consumed', g.run.encounterArmed === false);
    check('the ball is back in play', g.ball.held === false);

    // The creature must drift, or it is not a moving target.
    const x0 = g.sub.x, y0 = g.sub.y;
    for (let i = 0; i < 30; i++) g._driftCreature(g.sub, 0.016);
    check('the creature drifts', Math.hypot(g.sub.x - x0, g.sub.y - y0) > 1);
    check('the collider follows it',
          g.sub.collider.c.x === g.sub.x && g.sub.collider.c.y === g.sub.y);

    // It must stay inside its box however long it runs.
    for (let i = 0; i < 4000; i++) g._driftCreature(g.sub, 0.016);
    check('the creature stays in the upper field',
          g.sub.y > 40 && g.sub.y < 112 && g.sub.x > 14 && g.sub.x < 71,
          `${g.sub.x.toFixed(1)},${g.sub.y.toFixed(1)}`);

    /* Every contact the solver reported is counted, exactly once. */
    const target = g.sub;
    let hits = 0;
    strike(g); strike(g);
    g._creatureContacts(target, () => hits++);
    check('every reported contact counts', hits === 2, String(hits));
    check('the queue is drained', g._creatureHits.length === 0);
    g._creatureContacts(target, () => hits++);
    check('nothing is counted twice', hits === 2, String(hits));

    /**
     * Leaning on the creature is bounded by the collider's own cooldown rather
     * than by the frame rate, which is what replaced the old one-hit-per-approach
     * tag. A second of contact must produce a handful of hits, not 240.
     */
    g.ball.moveTo(target.x, target.y);
    g.ball.setVel(0, 0);
    let reported = 0;
    for (let i = 0; i < 240; i++) {
      g.world.step(PHYS_DT);
      reported += g.world.drainEvents()
        .filter(e => e.type === 'hit' && e.collider === target.collider).length;
    }
    check('contact is reported at least once', reported >= 1, String(reported));
    check('and the cooldown bounds it', reported <= 6, String(reported));
  }

  group('game: evolution');

    await store.startFresh();

    g.start('Mystic');

    const meditot = speciesByName('Meditot');       // Meditot -> Zenquaza

    g._updateEvolution(0.016);
    check('an early hit does not evolve it', g.phase === PHASE.EVOLUTION && g.sub !== null);

    check('shards collected', g.sub.shards === EVOLUTION_SHARDS, String(g.sub.shards));
    check('evolutionReady fired', events.some(e => e.t === 'evolutionReady'));

    // Now the hit lands.
    strike(g);
    g._updateEvolution(0.016);

    check('it evolves', g.sub === null && g.phase === PHASE.PLAY);
    check('evolve fired', events.some(e => e.t === 'evolve'));
    check('Zenquaza is registered', store.isRegistered(speciesByName('Zenquaza').id));
    check('the evolved shiny entered the dex',
          store.hasShiny(speciesByName('Zenquaza').id) === true);

          !g.world.colliders.some(c => c.meta?.role === 'creature'));

    check('a final form is not evolvable', g._evolvable().length === 0);
  }

  group('game: a mode owns the ball, so the Well is inert');
  {
    /**
     * The regression test for a bug that made Evolution Mode look broken.
     *
     * The Well's entry guard listed ENCOUNTER and BOSS and omitted EVOLUTION.
     * Dropping into the Well mid-evolution re-entered the saucer, found nothing
     * armed, and kicked the ball out with the default phase of PLAY — leaving
     * the evolution state live but never updated again. The creature stopped
     * moving, the clock stopped, hits stopped counting, and its collider was
     * left in the world for the rest of the game.
     *
     * Checked for all three modes, since any one of them could be missed.
     */
    const cases = [
      ['encounter', g2 => { g2.run.encounterArmed = true; }, PHASE.ENCOUNTER],
      ['evolution', g2 => {
        g2.run.caught.push({ uid: 'r1', speciesId: speciesByName('Meditot').id, shiny: false });
        g2.run.evolutionArmed = true;
      }, PHASE.EVOLUTION],
      ['boss', g2 => { g2.run.gateArmed = true; }, PHASE.BOSS]
    ];

    for (const [label, arm, expected] of cases) {
      await store.startFresh();
      const g2 = new Game({});
      g2.start('Mystic');
      g2.plungeRelease();
      arm(g2);

      g2._enterSaucer(g2.ball);
      g2._lastNow = 900000;
      g2._updateSaucer(900000);
      check(`${label} mode starts`, g2.phase === expected, g2.phase);

      const sub = g2.sub;
      const secondsBefore = sub.seconds;

      // Drop it straight back into the Well.
      g2.ball.held = false;
      g2.ball.moveTo(LAYOUT.saucer.x, LAYOUT.saucer.y);
      g2._enterSaucer(g2.ball);

      check(`  the Well ignores it during ${label}`, g2.phase === expected, g2.phase);
      check(`  the ball is not swallowed`, g2.ball.held === false);
      check(`  the mode is still live`, g2.sub === sub);

      // And it must still be running: clock ticking, hits landing.
      for (let i = 0; i < 30; i++) {
        if (expected === PHASE.ENCOUNTER) g2._updateEncounter(0.016);
        else if (expected === PHASE.EVOLUTION) g2._updateEvolution(0.016);
        else g2._updateBoss(0.016);
      }
      check(`  the ${label} clock is still running`, g2.sub.seconds < secondsBefore,
            `${secondsBefore.toFixed(2)} -> ${g2.sub.seconds.toFixed(2)}`);

      const moved = g2.sub.x !== LAYOUT.centre || g2.sub.y !== (expected === PHASE.BOSS ? 78 : 84);
      check(`  the ${label} creature is still moving`, moved);
    }
  }

  /**
   * The centre of the table has to get out of the way for a mode, the same way
   * the Well does. A creature drifts around the upper playfield and the whole
   * mode is about hitting it, so a wall of vines or the orbit ring standing
   * across the approach can lose a mode the player never got to attempt.
   *
   * Ownership is taken from the world, so this also proves the walls the gimmick
   * factories never returned — funnels, gear hubs — are covered. Those are the
   * ones a hand-written list would have missed.
   */
  group('table: a mode stands the centre down');
  {
    for (const type of MODE_KEYS) {
      await store.startFresh();
      const g2 = new Game({});
      g2.start(type);
      g2.plungeRelease();

      const gim = g2.parts.gimmick;
      check(`${type}: the centre owns something`, gim.owned.length > 0, String(gim.owned.length));
      check(`${type}: it starts awake`, gim.dormant === false);

      g2.run.encounterArmed = true;
      g2._enterSaucer(g2.ball);
      g2._lastNow = 960000;
      g2._updateSaucer(960000);
      check(`${type}: the encounter started`, g2.phase === PHASE.ENCOUNTER, g2.phase);

      check(`${type}: the centre is dormant`, gim.dormant === true);
      check(`${type}: nothing it owns can be touched`,
            gim.owned.every(o => o.active === false),
            gim.owned.filter(o => o.active !== false).map(o => o.id).join(','));

      // Driving it must not switch its own colliders back on. The updraught
      // reasserts `active` every frame, so this is not hypothetical.

    // Wrapping, in both directions.

          g2.run.lanes.join());

    for (let i = 0; i < 10; i++) g2.flip('left', true);
    check('holding a flipper does not keep rotating', g2.run.lanes.join() === held,
          g2.run.lanes.join());

    /* ---- the CATCH bank ---- */
    // Everything down except T, which is the example worth getting right: the
    // letter you still need should move from T to A on a left press.
    g2.run.bank = [true, true, false, true, true];
    g2.parts.bank.forEach((t, i) => { t.active = !g2.run.bank[i]; });

    g2.flip('left', false); g2.flip('left', true);

          g2.run.bank.join() === 'true,true,false,true,true', g2.run.bank.join());
    check('the targets stayed in step',
          g2.parts.bank.every((t, i) => t.active === !g2.run.bank[i]));

    // Rotating must not conjure a completion, and a full row cannot exist
    // anyway because both rows reset the instant they fill.
    const scoreBefore = g2.run.score;
    for (let i = 0; i < 20; i++) { g2.flip('right', false); g2.flip('right', true); }
    check('rotating never completes a row', g2.run.score === scoreBefore,

          g2.parts.bank.filter(t => t.active).length === 1);

    g2.world.tilted = true;

    g2.flip('right', false); g2.flip('right', true);

  /**
   * A ball save mid-mode must not freeze the game.
   *
   * The third instance of one bug: `phase` and `sub` are two records of the same
   * fact and they drift. A ball save returns the ball to the plunger and sets the
   * phase to PLUNGE, so the phase-keyed dispatch stopped updating a mode that was
   * still very much alive — creature frozen, clock frozen, hits ignored. Trivial
   * to hit now that a capture grants ten seconds of save.
   *
   * All three modes, because any one of them could be the one that is missed.
   */
  group('game: a ball save mid-mode does not freeze it');
  {
    const cases = [
      ['encounter', g2 => { g2.run.encounterArmed = true; }, PHASE.ENCOUNTER],
      ['evolution', g2 => {
        g2.run.caught.push({ uid: 'r1', speciesId: speciesByName('Meditot').id, shiny: false });
        g2.run.evolutionArmed = true;
      }, PHASE.EVOLUTION],
      ['boss', g2 => { g2.run.gateArmed = true; }, PHASE.BOSS]
    ];

    for (const [label, arm, expected] of cases) {
      await store.startFresh();
      const g2 = new Game({});
      g2.start('Mystic');
      g2.plungeRelease();
      arm(g2);

      g2._enterSaucer(g2.ball);
      g2._lastNow = 990000;
      g2._updateSaucer(990000);
      check(`${label}: the mode started`, g2.phase === expected, g2.phase);

      const sub = g2.sub;
      const secondsAtStart = sub.seconds;

      // Drain, with a save in hand. Exactly what a capture leaves behind.
      g2.run.ballSaveFor = CAPTURE_BALL_SAVE_SECONDS;
      g2.ball.moveTo(50, LAYOUT.drainY + 3);
      g2._checkDrain();

      check(`${label}: the ball was saved`, g2.phase === PHASE.PLUNGE, g2.phase);
      check(`${label}: the mode survived it`, g2.sub === sub);
      check(`${label}: its collider is still in the world`,
            g2.world.colliders.includes(sub.collider));
      check(`${label}: the centre is still standing down`,
            g2.parts.gimmick.dormant === true);

      /* Frozen means the creature stops moving. Run real frames and watch. */
      const x0 = sub.x, y0 = sub.y;
      let now = 991000;
      for (let i = 0; i < 60; i++) { now += 16; g2.update(now); }
      check(`${label}: the creature is still moving`,
            Math.hypot(sub.x - x0, sub.y - y0) > 1,
            `${x0.toFixed(1)},${y0.toFixed(1)} -> ${sub.x.toFixed(1)},${sub.y.toFixed(1)}`);

      // And the clock is held, not run down, while it waits in the plunger.
      check(`${label}: the clock is held in the lane`, sub.seconds === secondsAtStart,
            `${secondsAtStart.toFixed(2)} -> ${sub.seconds.toFixed(2)}`);

      // Plunging returns to the mode's phase, not to plain PLAY.
      g2.plungeRelease();
      check(`${label}: the plunge returns to the mode`, g2.phase === expected, g2.phase);

      // Now the clock runs again.
      for (let i = 0; i < 30; i++) { now += 16; g2.update(now); }
      check(`${label}: the clock restarts once the ball is out`,
            g2.sub === null || g2.sub.seconds < secondsAtStart,
            g2.sub ? g2.sub.seconds.toFixed(2) : 'mode ended');

      // And a hit still lands, which is what "hitting it does nothing" was.
      if (g2.sub) {
        const before = g2.sub.kind === 'evolution' ? g2.run.score : g2.sub.meter;
        strike(g2);
        g2.update(now += 16);
        const after = g2.sub
          ? (g2.sub.kind === 'evolution' ? g2.run.score : g2.sub.meter)
          : null;
        check(`${label}: hits count again`,
              after === null || (g2.sub.kind === 'evolution' ? after > before : after < before),
              `${before} -> ${after}`);
      }
    }

    /* A genuinely lost ball still ends the mode. The save must not have turned
       that off as a side effect. */
    await store.startFresh();
    const g3 = new Game({});
    g3.start('Mystic');
    g3.plungeRelease();
    g3.run.encounterArmed = true;
    g3._enterSaucer(g3.ball);
    g3._lastNow = 995000;
    g3._updateSaucer(995000);
    check('a mode is running', g3.sub !== null);

    g3.run.ballSaveFor = 0;
    g3.ball.moveTo(50, LAYOUT.drainY + 3);
    g3._checkDrain();
    check('with no save left, the ball is lost', g3.phase === PHASE.BALL_LOST, g3.phase);
    check('and the mode ended with it', g3.sub === null);
    check('the creature collider was cleaned up',
          !g3.world.colliders.some(c => c.meta?.role === 'creature'));
    check('and the centre came back', g3.parts.gimmick.dormant === false);
  }

    check('the game is over after three', g.phase === PHASE.GAME_OVER, g.phase);
    check('gameOver fired', events.some(e => e.t === 'gameOver'));
    check('the game was filed', store.s.stats.games === 1, String(store.s.stats.games));

    const over = events.find(e => e.t === 'gameOver');
    check('the result carries a rank', over.p.rank === null || over.p.rank >= 1);
    check('the result carries the mode', over.p.type === 'Neutral');
  }

  group('game: extra balls');
  {
    const events = [];

    check('crossing the threshold awards an extra ball', g.run.ballsLeft === 4, String(g.run.ballsLeft));
    check('extraBall fired', events.filter(e => e.t === 'extraBall').length === 1);

    check('it is not awarded twice', events.filter(e => e.t === 'extraBall').length === 1);

  group('game: tilt');
