<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!-- user-scalable=no because a pinch-zoom in the middle of a ball is never
     wanted, and viewport-fit=cover so the table reaches under the notch -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1024" />
<meta name="description" content="A pinball table for every element. Catch, evolve and collect the Elemental Awakening creatures." />
<title>Pinball Creatures</title>

<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="images/Pheonyx.png" />
<link rel="apple-touch-icon" href="images/Pheonyx.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ============ BOOT ============ -->
<div id="boot" class="boot">
  <div class="boot-mark"><span>◉</span></div>
  <h1>Pinball <span>Creatures</span></h1>
  <p id="boot-msg">Starting up…</p>
  <div class="boot-bar"><i></i></div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app hidden">

  <!-- ---- SCREENS ---- -->
  <main class="screens">

    <!-- TABLE -->
    <section class="screen active" id="screen-table">
      <div id="table-wrap" class="table-wrap">
        <canvas id="table" class="table"></canvas>

        <!-- HUD, laid over the table. Pointer events off so it never eats a
             flipper tap; the few things you can press turn them back on. -->
        <div id="hud" class="hud hidden">
          <div class="hud-top">
            <div class="hud-left">
              <b id="hud-score" class="score">0</b>
              <div class="hud-row">
                <span id="hud-mode" class="mode-name">—</span>
                <span id="hud-mult" class="chip mult">×1</span>
                <span id="hud-disc" class="chip disc">Disc</span>
              </div>
            </div>
            <!-- Change table is the only button left over the playfield. The
                 guide moved to the bottom bar: a small target at the top of a
                 pinball table competes with the flippers for every tap. -->
            <div class="hud-right">
              <span id="hud-ball" class="muted small">Ball 1</span>
              <span id="hud-balls" class="balls">●●●</span>
              <button id="btn-modes" class="hud-btn" type="button" title="Change table">☰</button>
            </div>
          </div>

          <div class="hud-letters">
            <div id="hud-bank" class="letters" aria-label="CATCH targets"></div>
            <div id="hud-lanes" class="letters lanes" aria-label="Top lanes"></div>
          </div>

          <div id="hud-armed" class="armed hidden"></div>

          <div id="hud-sub" class="sub-banner hidden">
            <div class="sub-top">
              <b id="hud-sub-label">—</b>
              <span id="hud-sub-time" class="mono">0:00</span>
            </div>
            <div class="sub-bar"><i id="hud-sub-bar"></i></div>
          </div>

          <div class="hud-bottom">
            <span id="hud-kb-left" class="kb" title="Left kickback">◄</span>
            <span id="hud-save" class="chip save hidden">SAVE</span>
            <span id="hud-tilt" class="chip tilt hidden">careful…</span>
            <span id="hud-kb-right" class="kb" title="Right kickback">►</span>
          </div>
        </div>

        <!-- Optional on-screen flippers, shown when the setting asks for them -->
        <div class="flip-buttons">
          <button class="flip-btn" data-flip="left" type="button" aria-label="Left flipper"></button>
          <button class="flip-btn" data-flip="right" type="button" aria-label="Right flipper"></button>
        </div>
      </div>
    </section>

    <!-- COLLECTION -->
    <section class="screen" id="screen-collection">
      <div class="screen-head"><h2>Collection</h2></div>
      <div id="collection-body" class="screen-body"></div>
    </section>

    <!-- SCORES -->
    <section class="screen" id="screen-scores">
      <div class="screen-head"><h2>Scores</h2></div>
      <div id="scores-body" class="screen-body"></div>
    </section>

    <!-- PROFILE -->
    <section class="screen" id="screen-profile">
      <div class="screen-head"><h2>Profile</h2></div>
      <div id="profile-body" class="screen-body"></div>
    </section>

    <!-- GUIDE -->
    <section class="screen" id="screen-guide">
      <div class="screen-head"><h2>How to play</h2></div>
      <div id="guide-body" class="screen-body"></div>
    </section>

  </main>

  <!-- ---- NAV ---- -->
  <nav class="nav">
    <button class="nav-btn active" data-screen="table" type="button"><span>◉</span>Play</button>
    <button class="nav-btn" data-screen="collection" type="button"><span>▦</span>Collection</button>
    <button class="nav-btn" data-screen="scores" type="button"><span>★</span>Scores</button>
    <button class="nav-btn" data-screen="profile" type="button"><span>☰</span>Profile</button>
    <button class="nav-btn" data-screen="guide" type="button"><span>?</span>Guide</button>
  </nav>
</div>

<!-- ============ SHEETS ============ -->

<div id="sheet-mode" class="sheet-wrap hidden">
  <div class="sheet-backdrop" data-close="sheet-mode"></div>
  <div class="sheet">
    <button class="sheet-close" data-close="sheet-mode" type="button">✕</button>
    <h3>Choose a table</h3>
    <p class="muted small">Each type is its own table with its own creatures. Your Collection is shared.</p>
    <div id="mode-body"></div>
  </div>
</div>

<div id="sheet-species" class="sheet-wrap hidden">
  <div class="sheet-backdrop" data-close="sheet-species"></div>
  <div class="sheet">
    <button class="sheet-close" data-close="sheet-species" type="button">✕</button>
    <div id="species-body"></div>
  </div>
</div>

<!-- No backdrop close: this one costs a shift charge, so it wants a real answer -->
<div id="sheet-shift" class="sheet-wrap hidden">
  <div class="sheet-backdrop"></div>
  <div class="sheet">
    <h3>Shift table?</h3>
    <div id="shift-body"></div>
  </div>
</div>

<div id="sheet-reveal" class="sheet-wrap hidden">
  <div class="sheet-backdrop" data-close="sheet-reveal"></div>
  <div class="sheet reveal-sheet">
    <div id="reveal-body"></div>
  </div>
</div>

<div id="sheet-gameover" class="sheet-wrap hidden">
  <div class="sheet-backdrop"></div>
  <div class="sheet">
    <h3>Game over</h3>
    <div id="gameover-body"></div>
  </div>
</div>

<!-- The guide is a screen in the bottom bar, not a sheet. It is long enough to
     want a scrolling screen, and a sheet raised from over the playfield was
     unreachable on a touchscreen. -->

<div id="toasts" class="toasts"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
